        }

        /* ── Supplier Ledger ── */
        function SupplierLedgerView({ user, supplierId, goBack }) {
            const [loading, setLoading] = useState(true);
            const [supplier, setSupplier] = useState(null);
            const [ledger, setLedger] = useState([]);
            const [totals, setTotals] = useState({ paid: 0, due: 0, total: 0 });
            const [payPurchase, setPayPurchase] = useState(null);
            const tableRef = useRef(null);
            const canWrite = user.role === 'admin' || user.role === 'manager' || user.role === 'warehouse_staff';

            useEffect(() => {
                if (supplierId) loadLedger();
                return () => { if (tableRef.current) { try { tableRef.current.destroy(); tableRef.current = null; } catch (e) { } } };
            }, [supplierId]);

            const loadLedger = async () => {
                if (!supplier) setLoading(true);
                try {
                    const r = await serverCall('getSupplierLedger', supplierId, user.id, user.role);
                    setLoading(false);
                    if (r.success) {
                        setSupplier(r.data.supplier);
                        setLedger(r.data.ledger);
                        const p = r.data.ledger.reduce((s, l) => s + l.paid_amount, 0);
                        const t = r.data.ledger.reduce((s, l) => s + l.total_amount, 0);
                        setTotals({ paid: Math.round(p * 100) / 100, due: Math.round((t - p) * 100) / 100, total: Math.round(t * 100) / 100 });
                        if (r.data.ledger.length > 0) setTimeout(() => initLedgerTable(r.data.ledger), 150);
                    } else { Swal.fire({ icon: 'error', text: r.message }); goBack(); }
                } catch (e) { setLoading(false); Swal.fire({ icon: 'error', text: 'Failed to load ledger' }); goBack(); }
            };

            const initLedgerTable = (data) => {
                if (tableRef.current) { try { tableRef.current.destroy(); tableRef.current = null; $('#ledgerTable').empty(); } catch (e) { } }
                setTimeout(() => {
                    try {
                        const t = $('#ledgerTable').DataTable({
                            data, destroy: true,
                            columns: [
                                { data: 'purchase_no', title: 'Purchase #', render: (d) => '<strong>' + d + '</strong>' },
                                { data: 'date', title: 'Date', render: (d) => d ? fmtDateShort(d) : '—' },
                                { data: 'total_amount', title: 'Total', render: (d) => '<strong>' + CS() + (d || 0).toLocaleString() + '</strong>' },
                                { data: 'paid_amount', title: 'Paid', render: (d) => '<span class="paid-amount">' + CS() + (d || 0).toLocaleString() + '</span>' },
                                { data: 'due', title: 'Due', render: (d) => d > 0 ? '<span class="due-amount">' + CS() + d.toLocaleString() + '</span>' : '<span style="color:#aaa">0</span>' },
                                { data: 'status', title: 'Status', render: (d) => '<span class="pur-status pur-' + d + '">' + d + '</span>' },
                                { data: 'balance', title: 'Balance', render: (d) => d > 0 ? '<span class="due-amount">' + CS() + d.toLocaleString() + '</span>' : '<span class="paid-amount">' + CS() + d.toLocaleString() + '</span>' },
                                { data: null, title: '', orderable: false, width: '40px', render: (_, __, row) => row.due > 0 && canWrite ? '<button class="action-icon" data-action="pay" title="Pay" style="color:#2e7d32"><i class="fas fa-hand-holding-usd"></i></button>' : '' }
                            ],
                            pageLength: 25, lengthMenu: [[25, 50, 100, -1], [25, 50, 100, "All"]], responsive: true, dom: 'Blfrtip',
                            buttons: [
                                { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: [0, 1, 2, 3, 4, 5, 6] } },
                                { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: [0, 1, 2, 3, 4, 5, 6] } },
                                { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: [0, 1, 2, 3, 4, 5, 6] } }
                            ],
                            order: [[0, 'asc']]
                        });
                        $('#ledgerTable').off('click', '.action-icon');
                        $('#ledgerTable').on('click', '.action-icon', function () {
                            const row = t.row($(this).parents('tr')).data();
                            if (row && row.due > 0) setPayPurchase(row);
                        });
                        tableRef.current = t;
                    } catch (e) { console.error('ledgerTable:', e); }
                }, 50);
            };

            if (loading) return <div><div className="skeleton-card"><div className="skeleton skeleton-text-large" style={{ width: '50%' }}></div><div className="skeleton skeleton-text" style={{ width: '80%' }}></div></div><div style={{ marginTop: '20px' }}><TableSkeleton rows={5} columns={6} /></div></div>;
            if (!supplier) return <div className="empty-state"><i className="fas fa-exclamation-circle"></i><p>Supplier not found</p></div>;

            return (
                <div>
                    <div className="ledger-back">
                        <button className="btn btn-secondary btn-sm" onClick={goBack}><i className="fas fa-arrow-left"></i> Back to Suppliers</button>
                    </div>

                    <div className="ledger-header">
                        <div className="ledger-info">
                            <h2><i className="fas fa-user-tie"></i> {supplier.name}</h2>
                            {supplier.phone && <p><i className="fas fa-phone"></i> <a href={'tel:' + supplier.phone} className="car-link">{supplier.phone}</a></p>}
                            {supplier.address && <p><i className="fas fa-map-marker-alt"></i> {supplier.address}</p>}
                        </div>
                        <div className="ledger-stats">
                            <div className="ledger-stat"><div className="ledger-stat-val" style={{ color: 'var(--navy-primary)' }}>{totals.total.toLocaleString()}</div><div className="ledger-stat-lbl">Total</div></div>
                            <div className="ledger-stat"><div className="ledger-stat-val paid-amount">{totals.paid.toLocaleString()}</div><div className="ledger-stat-lbl">Paid</div></div>
                            <div className="ledger-stat"><div className="ledger-stat-val due-amount">{totals.due.toLocaleString()}</div><div className="ledger-stat-lbl">Due</div></div>
                        </div>
                    </div>

                    <div className="data-section">
                        <div className="section-header"><h2><i className="fas fa-file-invoice-dollar"></i> Purchase Ledger</h2></div>
                        {ledger.length > 0 ? (
                            <table id="ledgerTable" className="display" style={{ width: '100%' }}></table>
                        ) : (
                            <div className="empty-state"><i className="fas fa-inbox"></i><p>No purchases recorded for this supplier yet</p></div>
                        )}
                    </div>

                    {payPurchase && <PaymentModal purchaseId={payPurchase.id} dueAmount={payPurchase.due} userId={user.id} role={user.role} onClose={() => setPayPurchase(null)} onSaved={() => { setPayPurchase(null); loadLedger(); }} />}
                </div>
            );
        }

        /* ── Purchases View ── */
        function PurchasesView({ user, openDetail }) {
            const _c = swrGet('purchases');
            const [loading, setLoading] = useState(!_c);
            const [purchases, setPurchases] = useState(_c || []);
            const [showForm, setShowForm] = useState(false);
            const [editingPur, setEditingPur] = useState(null);
            const [load, setLoad] = useState('');
            const tableRef = useRef(null);
            const [suppliers, setSuppliers] = useState([]);
            const [categories, setCategories] = useState([]);

            const canWrite = user.role === 'admin' || user.role === 'manager' || user.role === 'warehouse_staff';
            const canDelete = user.role === 'admin';

            useEffect(() => {
                if (_c) setTimeout(() => initTable(_c), 150);
                loadData();
                return () => { if (tableRef.current) tableRef.current.destroy(); };
            }, []);

            const loadData = async () => {
                if (!_c) setLoading(true);
                try {
                    const [pRes, spRes, catRes] = await Promise.all([
                        serverCall('getPurchases', user.id, user.role),
                        serverCall('getSuppliersForDropdown'),
                        serverCall('getCategoriesForDropdown')
                    ]);
                    setLoading(false);
                    if (pRes.success) { swrSet('purchases', pRes.data); setPurchases(pRes.data); initTable(pRes.data); }
                    if (spRes.success) setSuppliers(spRes.data);
                    if (catRes.success) setCategories(catRes.data);
                } catch (e) { setLoading(false); }
            };

            const initTable = (data) => {
                if (tableRef.current) { try { tableRef.current.destroy(); $('#purTable').empty(); } catch (e) { } }
                setTimeout(() => {
                    const t = $('#purTable').DataTable({
                        data, destroy: true,
                        columns: [
                            { data: 'purchase_no', title: 'Purchase No', render: (d) => '<strong>' + d + '</strong>' },
                            { data: 'supplier_name', title: 'Supplier' },
                            { data: 'category_name', title: 'Category', render: (d) => '<span class="role-badge role-manager">' + (d || 'General') + '</span>' },
                            { data: 'total_qty', title: 'Total Qty', className: 'dt-center' },
                            { data: 'total_amount', title: 'Total Amount', render: (d) => '<strong>' + CS() + (d || 0).toLocaleString() + '</strong>' },
                            { data: 'paid_amount', title: 'Paid', render: (d) => '<span class="paid-amount">' + CS() + (d || 0).toLocaleString() + '</span>' },
                            { data: 'due_amount', title: 'Due', render: (d) => d > 0 ? '<span class="due-amount">' + CS() + d.toLocaleString() + '</span>' : '0' },
                            { data: 'status', title: 'Status', render: (d) => '<span class="pur-status pur-' + d + '">' + d + '</span>' },
                            { data: 'purchase_date', title: 'Date', render: (d) => fmtDateShort(d) },
                            {
                                data: null, title: 'Actions', orderable: false, width: '120px', render: (_, __, row) => `
                            <button class="action-icon ledger-icon" data-action="detail" title="View Detail"><i class="fas fa-eye"></i></button>
                            ${canWrite ? `<button class="action-icon edit-icon" data-action="edit" title="Edit"><i class="fas fa-edit"></i></button>` : ''}
                            ${canDelete ? `<button class="action-icon delete-icon" data-action="delete" title="Delete"><i class="fas fa-trash"></i></button>` : ''}
                        `
                            }
                        ],
                        responsive: true, dom: 'Blfrtip', buttons: ['csv', 'print'], order: [[8, 'desc']]
                    });

                    $('#purTable').off('click', '.action-icon');
                    $('#purTable').on('click', '.action-icon', function () {
                        const action = $(this).data('action');
                        const row = t.row($(this).parents('tr')).data();
                        if (action === 'detail') openDetail(row.id);
                        else if (action === 'edit') setEditingPur(row);
                        else if (action === 'delete') handleDelete(row);
                    });
                    tableRef.current = t;
                }, 150);
            };

            const handleDelete = (pur) => {
                Swal.fire({
                    title: 'Delete Purchase?',
                    text: `Remove ${pur.purchase_no}?`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ea4335',
                    confirmButtonText: 'Delete'
                }).then(async (res) => {
                    if (res.isConfirmed) {
                        setLoad('Deleting...');
                        const r = await serverCall('deletePurchase', pur.id, user.id, user.role);
                        setLoad('');
                        if (r.success) { Swal.fire({ icon: 'success', text: 'Deleted', timer: 1500, showConfirmButton: false }); loadData(); }
                        else Swal.fire({ icon: 'error', text: r.message });
                    }
                });
            };

            return (
                <div className="data-section">
                    <div className="section-header">
                        <h2><i className="fas fa-shopping-cart"></i> Purchases</h2>
                        {canWrite && <button className="btn btn-success" onClick={() => setShowForm(true)}><i className="fas fa-plus"></i> Add Purchase</button>}
                    </div>

                    {loading ? <TableSkeleton rows={6} columns={10} /> : <table id="purTable" className="display" style={{ width: '100%' }}></table>}

                    {showForm && <PurchaseFormModal user={user} suppliers={suppliers} categories={categories} onClose={() => setShowForm(false)} onSaved={() => { setShowForm(false); loadData(); }} />}
                    {editingPur && <PurchaseEditModal purchase={editingPur} suppliers={suppliers} categories={categories} user={user} onClose={() => setEditingPur(null)} onSaved={() => { setEditingPur(null); loadData(); }} />}
                    {load && <div className="loading-ov"><div className="loading-popup">Processing...</div></div>}
                </div>
            );
        }

        /* ── Purchase Form Modal ── */
        function PurchaseFormModal({ user, suppliers, categories, onClose, onSaved }) {
            const [form, setForm] = useState({ supplier_id: '', category_id: '', purchase_date: new Date().toISOString().split('T')[0], avg_rate: '0', paid_amount: '0', notes: '' });

                    Swal.fire({ icon: 'success', text: 'Purchase recorded', timer: 1500, showConfirmButton: false });
                    onSaved();
                } else Swal.fire({ icon: 'error', text: r.message });

                        <div className="modal-header"><h3><i className="fas fa-plus-circle"></i> New Purchase</h3><button className="close-btn" onClick={onClose}>&times;</button></div>
                        <div className="modal-body">
                            <form onSubmit={handleSubmit}>
                                <div className="form-grid">
                                    <SearchableDropdown label="Supplier" options={spOpts} value={form.supplier_id} onChange={v => setForm({ ...form, supplier_id: v })} placeholder="Select supplier..." />
                                    <SearchableDropdown label="Category *" options={catOpts} value={form.category_id} onChange={v => setForm({ ...form, category_id: v })} placeholder="Select category..." required />
                                </div>
                                <div className="form-grid">
                                    <div className="form-group"><label>Date</label><input type="date" value={form.purchase_date} onChange={e => setForm({ ...form, purchase_date: e.target.value })} required /></div>
                                    <div className="form-group"><label>Paid Amount</label><input type="number" value={form.paid_amount} onChange={e => setForm({ ...form, paid_amount: e.target.value })} /></div>
                                </div>
                                <div className="form-group"><label>Notes</label><textarea rows="2" value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })}></textarea></div>
                                <div className="form-actions">
                                    <button type="submit" className="btn btn-primary">Save Purchase</button>
                                    <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

                                            <option value="completed">Completed</option>
                                            <option value="cancelled">Cancelled</option>
                                        </select>

                                </div>
                                <div className="form-grid">
                                    <div className="form-group"><label>Paid Amount</label><input type="number" value={form.paid_amount} onChange={e => setForm({ ...form, paid_amount: e.target.value })} /></div>

        /* ── Purchase Detail ── */
        function PurchaseDetailView({ user, purchaseId, goBack }) {
            const [loading, setLoading] = useState(true);
            const [detail, setDetail] = useState(null);
            const [showPayModal, setShowPayModal] = useState(false);
            const [load, setLoad] = useState('');
            const stocksTableRef = useRef(null);

            useEffect(() => { if (purchaseId) loadDetail(); return () => { if (stocksTableRef.current) { try { stocksTableRef.current.destroy(); } catch (e) { } } }; }, [purchaseId]);

            const loadDetail = async () => {
                if (!detail) setLoading(true);
                try {
                    const r = await serverCall('getPurchaseDetail', purchaseId, user.id, user.role);
                    setLoading(false);
                    if (r.success) { setDetail(r.data); if (r.data.stocks.length > 0) setTimeout(() => initStocksTable(r.data.stocks), 150); }
                    else { Swal.fire({ icon: 'error', text: r.message }); goBack(); }
                } catch (e) { setLoading(false); goBack(); }
            };

            const initStocksTable = (data) => {
                if (stocksTableRef.current) { try { stocksTableRef.current.destroy(); } catch (e) { } }
                setTimeout(() => {
                    try {
                        stocksTableRef.current = $('#purStocksTable').DataTable({
                            data, destroy: true,
                            columns: [
                                { data: 'item_code', title: 'Item Code' },
                                { data: 'item_name', title: 'Item Name' },
                                { data: 'qty', title: 'Qty', className: 'dt-center', render: (d) => d > 1 ? '<span class="piece-badge total">' + d + '</span>' : (d || 1) },
                                { data: 'status', title: 'Status', render: (d) => '<span class="piece-badge ' + (d === 'available' ? 'avail' : d === 'sold' ? 'sold' : 'total') + '">' + (d || '-') + '</span>' },
                                { data: 'buy_price', title: 'Buy Price', render: (d) => CS() + (d || 0).toLocaleString() },
                                { data: 'sell_price', title: 'Sell Price', render: (d) => CS() + (d || 0).toLocaleString() }
                            ],
                            pageLength: 10, responsive: true, dom: 'lfrtip', order: [[0, 'asc']]
                        });
                    } catch (e) { }
                }, 50);
            };

            if (loading) return <div><div className="skeleton-card"><div className="skeleton skeleton-text-large" style={{ width: '40%' }}></div><div className="skeleton skeleton-text" style={{ width: '70%' }}></div></div><div style={{ marginTop: '20px' }}><TableSkeleton rows={4} columns={5} /></div></div>;
            if (!detail) return <div className="empty-state"><i className="fas fa-exclamation-circle"></i><p>Purchase not found</p></div>;

            const canWrite = user.role === 'admin' || user.role === 'manager' || user.role === 'warehouse_staff';

            return (
                <div>
                    <div className="ledger-back"><button className="btn btn-secondary btn-sm" onClick={goBack}><i className="fas fa-arrow-left"></i> Back to Purchases</button></div>

                    <div className="data-section" style={{ marginBottom: '20px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                            <h2 style={{ color: '#333', display: 'flex', alignItems: 'center', gap: '10px' }}><i className="fas fa-file-alt"></i> {detail.purchase_no}</h2>
                            <span className={'pur-status pur-' + detail.status}>{detail.status}</span>
                        </div>
                        <div className="pur-info-grid">
                            <div className="pur-info-item"><label>Supplier</label><span>{detail.supplier_name}</span></div>
                            <div className="pur-info-item"><label>Category</label><span>{detail.category_name}</span></div>
                            <div className="pur-info-item"><label>Date</label><span>{fmtDateShort(detail.purchase_date)}</span></div>
                            <div className="pur-info-item"><label>Total Qty</label><span>{detail.total_qty}</span></div>
                            <div className="pur-info-item"><label>Avg Rate</label><span>{CS()}{detail.avg_rate.toLocaleString()}</span></div>
                            <div className="pur-info-item"><label>Total Amount</label><span><strong>{CS()}{detail.total_amount.toLocaleString()}</strong></span></div>
                            <div className="pur-info-item"><label>Paid</label><span className="paid-amount">{CS()}{detail.paid_amount.toLocaleString()}</span></div>
                            <div className="pur-info-item"><label>Due</label><span className="due-amount">{CS()}{detail.due_amount.toLocaleString()}</span></div>
                        </div>
                    </div>

                    <div className="data-section" style={{ marginBottom: '20px' }}>
                        <h2 style={{ color: '#333', marginBottom: '15px', display: 'flex', alignItems: 'center', gap: '10px' }}><i className="fas fa-layer-group"></i> Item Stocks</h2>
                        {detail.stocks.length > 0 ? <table id="purStocksTable" className="display" style={{ width: '100%' }}></table> : <div className="empty-state"><i className="fas fa-inbox"></i><p>No item stocks linked yet</p></div>}
                    </div>

                    <div className="data-section">
                        <div className="section-header">
                            <h2><i className="fas fa-money-bill-wave"></i> Payment History</h2>
                            {canWrite && detail.due_amount > 0 && <button className="btn btn-success btn-sm" onClick={() => setShowPayModal(true)}><i className="fas fa-plus"></i> Add Payment</button>}
                        </div>
                        {detail.payments.length > 0 ? detail.payments.map((p, i) => (
                            <div key={i} className="payment-row">
                                <div><span className="paid-amount" style={{ fontSize: '16px', fontWeight: '700' }}>{CS()}{p.amount.toLocaleString()}</span>{p.notes && <span style={{ color: '#888', fontSize: '13px', marginLeft: '10px' }}>— {p.notes}</span>}</div>
                                <div style={{ textAlign: 'right' }}><div style={{ fontSize: '13px', color: '#888' }}>{fmtDateShort(p.date)}</div><div style={{ fontSize: '12px', color: '#aaa' }}>by {p.created_by_name}</div></div>
                            </div>
                        )) : <div className="empty-state"><i className="fas fa-inbox"></i><p>No payments recorded yet</p></div>}
                    </div>

                    {showPayModal && <PaymentModal purchaseId={detail.id} dueAmount={detail.due_amount} userId={user.id} role={user.role} onClose={() => setShowPayModal(false)} onSaved={() => { setShowPayModal(false); loadDetail(); }} />}
                </div>
            );
        }

        function PaymentModal({ purchaseId, dueAmount, userId, role, onClose, onSaved }) {
            const [form, setForm] = useState({ amount: '', payment_method: 'cash', reference_no: '', payment_date: new Date().toISOString().split('T')[0], notes: '' });
            const [saving, setSaving] = useState(false);
            const methodOpts = [{ value: 'cash', label: 'Cash' }, { value: 'bank', label: 'Bank Transfer' }, { value: 'bkash', label: 'bKash' }, { value: 'nagad', label: 'Nagad' }, { value: 'cheque', label: 'Cheque' }];

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (parseFloat(form.amount) <= 0) return Swal.fire({ icon: 'warning', text: 'Enter valid amount' });
                if (parseFloat(form.amount) > dueAmount) return Swal.fire({ icon: 'warning', text: 'Amount exceeds due' });
                setSaving(true);
                const r = await serverCall('addPayment', { purchase_id: purchaseId, ...form }, userId, role);
                setSaving(false);
                if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 1500, showConfirmButton: false }); onSaved(); }
                else Swal.fire({ icon: 'error', text: r.message });
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" style={{ maxWidth: '450px' }} onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header"><h3><i className="fas fa-money-bill-wave"></i> Add Payment</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
                        <div className="modal-body">
                            <p style={{ marginBottom: '16px', fontSize: '14px', color: '#666' }}>Due: <strong className="due-amount">{CS()}{dueAmount.toLocaleString()}</strong></p>
                            <form onSubmit={handleSubmit}>
                                <div className="form-group"><label><i className="fas fa-money-bill-wave"></i> Amount *</label><input type="number" step="0.01" max={dueAmount} value={form.amount} onChange={(e) => setForm({ ...form, amount: e.target.value })} required /></div>
                                <SearchableDropdown label="Payment Method" icon="fas fa-credit-card" options={methodOpts} value={form.payment_method} onChange={(v) => setForm({ ...form, payment_method: v || 'cash' })} />
                                <div className="form-group"><label><i className="fas fa-hashtag"></i> Reference #</label><input type="text" value={form.reference_no} onChange={(e) => setForm({ ...form, reference_no: e.target.value })} /></div>
                                <div className="form-group"><label><i className="fas fa-calendar-alt"></i> Payment Date</label><input type="date" value={form.payment_date} onChange={(e) => setForm({ ...form, payment_date: e.target.value })} /></div>
                                <div className="form-group"><label><i className="fas fa-sticky-note"></i> Notes</label><input type="text" value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} /></div>
                                <div className="form-actions">
                                    <button type="submit" className="btn btn-success" disabled={saving}>{saving ? 'Saving...' : 'Record Payment'}</button>
                                    <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        /* ── Item Inventory ── */
        function ItemInventoryView({ user }) {
            const _c = swrGet('item');
            const [loading, setLoading] = useState(!_c);
            const [stocks, setStocks] = useState(_c || []);
            const [showDrawer, setShowDrawer] = useState(false);
            const [detailStock, setDetailStock] = useState(null);
            const [load, setLoad] = useState('');
            const [categories, setCategories] = useState([]);
            const tableRef = useRef(null);

            const canWrite = user.role === 'admin' || user.role === 'manager' || user.role === 'warehouse_staff';
            const canDelete = user.role === 'admin';

            useEffect(() => {
                if (_c) setTimeout(() => initTable(_c), 150);
                loadData();
                return () => { if (tableRef.current) tableRef.current.destroy(); };
            }, []);

            const loadData = async () => {
                if (!_c) setLoading(true);
                try {
                    const [wsRes, catRes] = await Promise.all([
                        serverCall('getItemStocks', user.id, user.role),
                        serverCall('getCategoriesForDropdown')
                    ]);
                    setLoading(false);
                    if (wsRes.success) { swrSet('item', wsRes.data); setStocks(wsRes.data); initTable(wsRes.data); }
                    if (catRes.success) setCategories(catRes.data);
                } catch (e) { setLoading(false); }
            };

            const qStats = React.useMemo(() => {
                const avail = stocks.filter(s => s.status === 'available');
                return {
                    totalAvail: avail.reduce((s, w) => s + (parseInt(w.qty) || 0), 0),
                    stockValue: avail.reduce((s, w) => s + (parseFloat(w.sell_price) || 0), 0),
                    investment: avail.reduce((s, w) => s + (parseFloat(w.buy_price) || 0), 0),
                    profit: avail.reduce((s, w) => s + ((parseFloat(w.sell_price) || 0) - (parseFloat(w.buy_price) || 0)), 0)
                };
            }, [stocks]);

            const initTable = (data) => {
                if (tableRef.current) { try { tableRef.current.destroy(); $('#itemTable').empty(); } catch (e) { } }
                setTimeout(() => {
                    const t = $('#itemTable').DataTable({
                        data, destroy: true,
                        columns: [
                            { data: null, title: '', orderable: false, width: '56px', render: (d, __, row) => row.image ? '<img src="https://lh3.google.com/u/0/d/' + row.image + '" class="dt-thumb" />' : '<span class="dt-thumb-ph"><i class="fas fa-image"></i></span>' },
                            { data: 'item_name', title: 'Item Name', render: (d) => '<a class="car-link"><strong>' + d + '</strong></a>' },
                            { data: 'item_code', title: 'Item Code' },
                            { data: 'category_name', title: 'Category', render: (d) => '<span class="role-badge role-manager">' + (d || 'General') + '</span>' },
                            { data: 'qty', title: 'Qty', className: 'dt-center', render: (d) => '<span class="piece-badge total">' + (d || 0) + '</span>' },
                            { data: 'buy_rate', title: 'Buy Rate', render: (d) => CS() + (d || 0).toLocaleString() },
                            { data: 'sell_rate', title: 'Sell Rate', render: (d) => CS() + (d || 0).toLocaleString() },
                            { data: 'buy_price', title: 'Buy Total', render: (d) => CS() + (d || 0).toLocaleString() },
                            { data: 'sell_price', title: 'Sell Total', render: (d) => '<strong>' + CS() + (d || 0).toLocaleString() + '</strong>' },
                            { data: 'status', title: 'Status', render: (d) => '<span class="pur-status ws-' + d + '">' + d + '</span>' },
                            {
                                data: null, title: 'Actions', orderable: false, width: '100px', render: (_, __, row) => {
                                    let h = '<button class="action-icon ledger-icon" data-action="detail"><i class="fas fa-eye"></i></button>';
                                    h += '<button class="action-icon edit-icon" data-action="edit"><i class="fas fa-edit"></i></button>';
                                    if (canDelete && row.status !== 'sold') h += '<button class="action-icon delete-icon" data-action="delete"><i class="fas fa-trash"></i></button>';
                                    return h;
                                }
                            }
                        ],
                        responsive: true, dom: 'Blfrtip', buttons: ['csv', 'print']
                    });

                    $('#itemTable').off('click', '.car-link, .action-icon');
                    $('#itemTable').on('click', '.car-link, .action-icon', function () {
                        const action = $(this).data('action') || 'detail';
                        const row = t.row($(this).parents('tr')).data();
                        if (action === 'detail' || action === 'edit') setDetailStock(row);
                        else if (action === 'delete') handleDelete(row);
                    });
                    tableRef.current = t;
                }, 150);
            };

            const handleDelete = (ws) => {
                Swal.fire({
                    title: 'Are you sure?',
                    text: `Delete ${ws.item_name || ws.item_code}?`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ea4335',
                    confirmButtonText: 'Yes, Delete'
                }).then(async (res) => {
                    if (res.isConfirmed) {
                        setLoad('Deleting...');
                        const r = await serverCall('deleteItemStock', ws.id, user.id, user.role);
                        setLoad('');
                        if (r.success) { Swal.fire({ icon: 'success', text: 'Deleted', timer: 1500, showConfirmButton: false }); loadData(); }
                        else Swal.fire({ icon: 'error', text: r.message });
                    }
                });
            };

            return (
                <div>
                    {!loading && (
                        <div className="quick-stats">
                            <div className="quick-stat"><div className="quick-stat-icon" style={{ background: '#2e7d32' }}><i className="fas fa-cubes"></i></div><div><div className="quick-stat-val">{qStats.totalAvail}</div><div className="quick-stat-lbl">Available Qty</div></div></div>
                            <div className="quick-stat"><div className="quick-stat-icon" style={{ background: 'var(--navy-accent)' }}><i className="fas fa-tags"></i></div><div><div className="quick-stat-val">{CS()}{Math.round(qStats.stockValue).toLocaleString()}</div><div className="quick-stat-lbl">Stock Value</div></div></div>
                            <div className="quick-stat"><div className="quick-stat-icon" style={{ background: '#e65100' }}><i className="fas fa-coins"></i></div><div><div className="quick-stat-val">{CS()}{Math.round(qStats.investment).toLocaleString()}</div><div className="quick-stat-lbl">Investment</div></div></div>
                            <div className="quick-stat"><div className="quick-stat-icon" style={{ background: '#6f42c1' }}><i className="fas fa-chart-line"></i></div><div><div className="quick-stat-val" style={{ color: '#2e7d32' }}>{CS()}{Math.round(qStats.profit).toLocaleString()}</div><div className="quick-stat-lbl">Exp. Profit</div></div></div>
                        </div>
                    )}

                    <div className="data-section">
                        <div className="section-header">
                            <h2><i className="fas fa-boxes"></i> Item Inventory</h2>
                            {canWrite && <button className="btn btn-success" onClick={() => setShowDrawer(true)}><i className="fas fa-plus"></i> Add Item</button>}
                        </div>
                        {loading ? <TableSkeleton rows={8} columns={10} /> : <table id="itemTable" className="display" style={{ width: '100%' }}></table>}
                    </div>

                    {showDrawer && <ItemDrawer user={user} categories={categories} onClose={() => setShowDrawer(false)} onSaved={() => { setShowDrawer(false); loadData(); }} />}
                    {detailStock && <ItemDetailModal stock={detailStock} user={user} categories={categories} onClose={() => setDetailStock(null)} onUpdated={() => { setDetailStock(null); loadData(); }} />}
                    {load && <div className="loading-ov"><div className="loading-popup">Processing...</div></div>}
                </div>
            );
        }

        function ItemDrawer({ user, categories, onClose, onSaved }) {
            const [form, setForm] = useState({ item_name: '', item_code: '', category_id: '', qty: '1', buy_rate: '0', sell_rate: '0', notes: '' });
            const [imageData, setImageData] = useState(null);
            const [saving, setSaving] = useState(false);

            const catOptions = categories.map(c => ({ value: String(c.id), label: c.name }));

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!form.item_name || !form.category_id) { Swal.fire({ icon: 'warning', text: 'Item name and category required' }); return; }
                setSaving(true);
                const r = await serverCall('addItemStock', { ...form, imageData }, user.id, user.role);
                setSaving(false);
                if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 1500, showConfirmButton: false }); onSaved(); }
                else Swal.fire({ icon: 'error', text: r.message });
            };

            return (
                <div>
                    <div className="drawer-overlay" onClick={onClose}></div>
                    <div className="drawer open">
                        <div className="drawer-header"><h3><i className="fas fa-plus-circle"></i> Add / Update Item Stock</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
                        <div className="drawer-body">
                            <div className="dash-alert info" style={{ marginBottom: '15px' }}><i className="fas fa-info-circle dash-alert-ico"></i><div className="dash-alert-text">If an item with the same <strong>name</strong> exists in the selected category, its stock will be incremented.</div></div>
                            <form onSubmit={handleSubmit}>
                                <div className="form-group"><label>Item Name *</label><input type="text" value={form.item_name} onChange={e => setForm({ ...form, item_name: e.target.value })} required /></div>
                                <div className="form-group"><label>Item Code (Optional)</label><input type="text" value={form.item_code} onChange={e => setForm({ ...form, item_code: e.target.value })} /></div>
                                <SearchableDropdown label="Category *" icon="fas fa-th-large" options={catOptions} value={form.category_id} onChange={v => setForm({ ...form, category_id: v })} required />
                                <div className="form-group"><label>Quantity to Add</label><input type="number" min="1" value={form.qty} onChange={e => setForm({ ...form, qty: e.target.value })} /></div>
                                <div className="form-grid">
                                    <div className="form-group"><label>Buy Rate</label><input type="number" step="0.01" value={form.buy_rate} onChange={e => setForm({ ...form, buy_rate: e.target.value })} /></div>
                                    <div className="form-group"><label>Sell Rate</label><input type="number" step="0.01" value={form.sell_rate} onChange={e => setForm({ ...form, sell_rate: e.target.value })} /></div>
                                </div>
                                <div className="form-group"><label>Notes</label><textarea rows="2" value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })}></textarea></div>
                                <AvatarUpload onChange={d => setImageData(d)} label="Item Image" icon="fas fa-image" round={false} />
                                <div className="form-actions">
                                    <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? 'Saving...' : 'Save Item'}</button>
                                    <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

            const handleUpdate = async (e) => {
                e.preventDefault();
                setLoad('Updating...');
                const r = await serverCall('updateItemStock', { ...form }, user.id, user.role);

                if (r.success) { Swal.fire({ icon: 'success', text: 'Updated', timer: 1500, showConfirmButton: false }); onUpdated(); }
                else Swal.fire({ icon: 'error', text: r.message });
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" style={{ maxWidth: '600px' }} onClick={e => e.stopPropagation()}>
                        <div className="modal-header">
                            <h3><i className="fas fa-info-circle"></i> {editMode ? 'Edit Item' : 'Item Details'}</h3>
                            <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
                        </div>
                        <div className="modal-body">
                            {editMode ? (
                                <form onSubmit={handleUpdate}>
                                    <div className="form-group"><label>Item Name</label><input type="text" value={form.item_name} onChange={e => setForm({ ...form, item_name: e.target.value })} required /></div>
                                    <div className="form-group"><label>Item Code</label><input type="text" value={form.item_code} onChange={e => setForm({ ...form, item_code: e.target.value })} /></div>
                                    <SearchableDropdown label="Category" options={catOptions} value={form.category_id} onChange={v => setForm({ ...form, category_id: v })} />
                                    <div className="form-grid">
                                        <div className="form-group"><label>Qty</label><input type="number" value={form.qty} onChange={e => setForm({ ...form, qty: e.target.value })} /></div>

                                        <div className="form-group"><label>Sell Rate</label><input type="number" value={form.sell_rate} onChange={e => setForm({ ...form, sell_rate: e.target.value })} /></div>
                                    </div>
                                    <div className="form-actions">
                                        <button type="submit" className="btn btn-primary">Save Changes</button>
                                        <button type="button" className="btn btn-secondary" onClick={() => setEditMode(false)}>Cancel</button>

                                    {stock.image ? <img src={'https://lh3.google.com/u/0/d/' + stock.image} style={{ width: '200px', borderRadius: '8px', marginBottom: '15px' }} /> : <div className="ppc-img-ph" style={{ height: '150px' }}><i className="fas fa-image fa-3x"></i></div>}
                                    <div className="stock-detail-grid">

                                        <div className="stock-detail-item"><div className="val">{stock.item_code || '-'}</div><div className="lbl">Code</div></div>
                                        <div className="stock-detail-item"><div className="val">{stock.category_name}</div><div className="lbl">Category</div></div>
                                        <div className="stock-detail-item"><div className="val">{stock.qty}</div><div className="lbl">Quantity</div></div>
