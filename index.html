                            <div className="quick-stat" style={{ borderLeftColor: '#ea4335' }}>
                                <div className="quick-stat-icon" style={{ background: '#ea4335' }}><i className="fas fa-receipt"></i></div>
                                <div><div className="quick-stat-val">{CS()}{qStats.thisMonth.toLocaleString()}</div><div className="quick-stat-lbl">This Month Expense</div></div>
                            </div>
                            <div className="quick-stat" style={{ borderLeftColor: 'var(--navy-primary)' }}>
                                <div className="quick-stat-icon" style={{ background: 'var(--navy)' }}><i className="fas fa-history"></i></div>
                                <div><div className="quick-stat-val">{CS()}{qStats.total.toLocaleString()}</div><div className="quick-stat-lbl">Total All Time</div></div>
                            </div>
                        </div>
                    )}

                    <div className="data-section">
                        <div className="section-header">
                            <h2><i className="fas fa-receipt"></i> Business Expenses</h2>
                            {canWrite && <button className="btn btn-danger" onClick={() => { setEditingExp(null); setShowModal(true); }}><i className="fas fa-plus"></i> Add Expense</button>}
                        </div>
                        {loading ? <TableSkeleton rows={5} columns={6} /> : <table id="expTable" className="display" style={{ width: '100%' }}></table>}
                    </div>

                    {showModal && <ExpenseModal editExp={editingExp} onClose={() => setShowModal(false)} onSave={handleSave} />}
                    {load && <div className="loading-ov"><div className="loading-popup">Processing...</div></div>}
                </div>
            );
        }

        /* ── Expense Modal ── */
        function ExpenseModal({ editExp, onClose, onSave }) {
            const [form, setForm] = useState({
                title: editExp?.title || '', category: editExp?.category || 'other',
                amount: editExp?.amount || '', expense_date: editExp?.expense_date || new Date().toISOString().split('T')[0],
                notes: editExp?.notes || ''
            });

            const categories = [
                { value: 'transport', label: 'Transport / Conveyance' }, { value: 'labor', label: 'Labor / Wages' },
                { value: 'utility', label: 'Utility (Bills)' }, { value: 'rent', label: 'Office/Shop Rent' },
                { value: 'maintenance', label: 'Maintenance' }, { value: 'other', label: 'Others' }
            ];

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" style={{ maxWidth: '480px' }} onClick={e => e.stopPropagation()}>
                        <div className="modal-header" style={{ background: '#ea4335' }}>
                            <h3><i className="fas fa-minus-circle"></i> {editExp ? 'Edit Expense' : 'New Expense'}</h3>
                            <button className="close-btn" onClick={onClose}>&times;</button>
                        </div>
                        <div className="modal-body">
                            <form onSubmit={(e) => { e.preventDefault(); onSave(form); }}>
                                <div className="form-group"><label>Expense Title *</label><input type="text" value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} required /></div>
                                <SearchableDropdown label="Category *" options={categories} value={form.category} onChange={v => setForm({ ...form, category: v })} />
                                <div className="form-grid">
                                    <div className="form-group"><label>Amount *</label><input type="number" step="0.01" value={form.amount} onChange={e => setForm({ ...form, amount: e.target.value })} required /></div>
                                    <div className="form-group"><label>Date</label><input type="date" value={form.expense_date} onChange={e => setForm({ ...form, expense_date: e.target.value })} required /></div>
                                </div>
                                <div className="form-group"><label>Notes</label><textarea rows="2" value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })}></textarea></div>
                                <div className="form-actions">
                                    <button type="submit" className="btn btn-danger" style={{ background: '#ea4335' }}>{editExp ? 'Update' : 'Save'} Expense</button>
                                    <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        /* ── Settings View ── */
        function SettingsView({ user, onSettingsUpdate }) {
            const [loading, setLoading] = useState(true);
            const [settings, setSettings] = useState({});
            const [saving, setSaving] = useState(false);

            useEffect(() => {
                serverCall('getSettings').then(r => { setLoading(false); if (r.success) setSettings(r.data); });
            }, []);

            const updateField = (key, val) => setSettings(prev => ({ ...prev, [key]: val }));

            const handleSave = async () => {
                setSaving(true);
                try {
                    const r = await serverCall('saveAllSettings', settings, user.id, user.role);
                    setSaving(false);
                    if (r.success) { if (onSettingsUpdate) onSettingsUpdate(settings); Swal.fire({ icon: 'success', text: 'Settings saved!', timer: 1500, showConfirmButton: false }); }
                    else Swal.fire({ icon: 'error', text: r.message });
                } catch (e) { setSaving(false); Swal.fire({ icon: 'error', text: 'Failed' }); }
            };

            if (loading) return <div className="data-section"><div className="skeleton skeleton-text-large" style={{ width: '40%' }}></div></div>;

            return (
                <div style={{ width: '100%' }}>
                    <div className="settings-section">
                        <div className="settings-section-header"><h3><i className="fas fa-building"></i> Business Information</h3></div>
                        <div className="settings-section-body">
                            <div className="settings-grid">
                                <div className="form-group"><label>Business Name</label><input type="text" value={settings.business_name || ''} onChange={(e) => updateField('business_name', e.target.value)} /></div>
                                <div className="form-group"><label>Phone</label><input type="tel" value={settings.business_phone || ''} onChange={(e) => updateField('business_phone', e.target.value)} /></div>
                            </div>
                            <div className="form-group"><label>Address</label><textarea rows="2" value={settings.business_address || ''} onChange={(e) => updateField('business_address', e.target.value)}></textarea></div>
                            <div className="form-group" style={{ maxWidth: '200px' }}><label>Currency Symbol</label><input type="text" value={settings.currency_symbol || CS()} onChange={(e) => updateField('currency_symbol', e.target.value)} /></div>
                        </div>
                    </div>
                    <div className="settings-section">
                        <div className="settings-section-header"><h3><i className="fas fa-tag"></i> Default Rates</h3></div>
                        <div className="settings-section-body">
                            <div className="settings-grid">
                                <div className="form-group"><label>Default Buy Rate</label><input type="number" step="0.01" value={settings.default_buy_rate || '0'} onChange={(e) => updateField('default_buy_rate', e.target.value)} /></div>
                                <div className="form-group"><label>Default Sell Rate</label><input type="number" step="0.01" value={settings.default_sell_rate || '0'} onChange={(e) => updateField('default_sell_rate', e.target.value)} /></div>
                            </div>
                        </div>
                    </div>
                    <div className="settings-section">
                        <div className="settings-section-header"><h3><i className="fas fa-file-invoice"></i> Invoice Settings</h3></div>
                        <div className="settings-section-body">
                            <div className="settings-grid">
                                <div className="form-group"><label>Invoice Prefix</label><input type="text" value={settings.invoice_prefix || 'INV'} onChange={(e) => updateField('invoice_prefix', e.target.value)} /></div>
                                <div className="form-group"><label>Purchase Prefix</label><input type="text" value={settings.purchase_prefix || 'PUR'} onChange={(e) => updateField('purchase_prefix', e.target.value)} /></div>
                            </div>
                            <div className="form-group"><label>Invoice Footer Text</label><textarea rows="2" value={settings.invoice_footer || ''} onChange={(e) => updateField('invoice_footer', e.target.value)}></textarea></div>
                        </div>
                    </div>
                    <div style={{ textAlign: 'right', marginTop: '10px' }}>
                        <button className="btn btn-primary" onClick={handleSave} disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> Save All Settings</>}</button>
                    </div>
                </div>
            );
        }

        /* ── Reports View ── */
        function ReportsView({ user }) {
            const [activeReport, setActiveReport] = useState('profit_loss');
            const [loading, setLoading] = useState(false);
            const [data, setData] = useState(null);
            const [filters, setFilters] = useState({ dateFrom: new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0], dateTo: new Date().toISOString().split('T')[0], groupBy: 'daily' });
            const chartRef = useRef(null);
            const tableRef = useRef(null);

            const reports = [
                { id: 'profit_loss', label: 'Profit / Loss', icon: 'fas fa-balance-scale', color: '#1565c0' },
                { id: 'sales_summary', label: 'Sales Summary', icon: 'fas fa-chart-line', color: '#2e7d32' },
                { id: 'stock_aging', label: 'Stock Aging', icon: 'fas fa-hourglass-half', color: '#e65100' },
                { id: 'customer_profit', label: 'Customer Analysis', icon: 'fas fa-users', color: '#6f42c1' },
                { id: 'category_report', label: 'Category P&L', icon: 'fas fa-th-large', color: '#00838f' }
            ];

            const loadReport = async () => {
                setLoading(true); setData(null);
                if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
                if (tableRef.current) { try { tableRef.current.destroy(); tableRef.current = null; } catch (e) { } }
                try {
                    const r = await serverCall('getReportsData', activeReport, filters, user.id, user.role);
                    setLoading(false);
                    if (r.success) { setData(r.data); setTimeout(() => renderReport(activeReport, r.data), 200); }
                    else Swal.fire({ icon: 'error', text: r.message });
                } catch (e) { setLoading(false); Swal.fire({ icon: 'error', text: 'Failed to load report' }); }
            };

            useEffect(() => { loadReport(); }, [activeReport]);
            useEffect(() => { return () => { if (chartRef.current) chartRef.current.destroy(); if (tableRef.current) { try { tableRef.current.destroy(); } catch (e) { } } }; }, []);

            const renderReport = (type, d) => {
                if (!d) return;
                if (type === 'profit_loss' && d.dailyData?.length) {
                    const ctx = document.getElementById('reportChart');
                    if (ctx) {
                        if (chartRef.current) chartRef.current.destroy();
                        chartRef.current = new Chart(ctx, {
                            type: 'bar', data: {
                                labels: d.dailyData.map(x => x.date), datasets: [
                                    { label: 'Sales', data: d.dailyData.map(x => x.sales), backgroundColor: 'rgba(46,125,50,0.7)', borderRadius: 3 },
                                    { label: 'Purchases', data: d.dailyData.map(x => x.purchases), backgroundColor: 'rgba(21,101,192,0.7)', borderRadius: 3 },
                                    { label: 'Expenses', data: d.dailyData.map(x => x.expenses), backgroundColor: 'rgba(198,40,40,0.5)', borderRadius: 3 }
                                ]
                            }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true }, x: { grid: { display: false } } } }
                        });
                    }
                }
                if (type === 'sales_summary' && d.groupedData?.length) {
                    const ctx = document.getElementById('reportChart');
                    if (ctx) {
                        if (chartRef.current) chartRef.current.destroy();
                        const gr = ctx.getContext('2d').createLinearGradient(0, 0, 0, 280);
                        gr.addColorStop(0, 'rgba(0,31,63,0.5)'); gr.addColorStop(1, 'rgba(0,31,63,0)');
                        chartRef.current = new Chart(ctx, { type: 'line', data: { labels: d.groupedData.map(x => x.label), datasets: [{ label: 'Sales', data: d.groupedData.map(x => x.amount), borderColor: '#001f3f', backgroundColor: gr, fill: true, tension: 0.4, pointRadius: 3 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true }, x: { grid: { display: false } } } } });
                    }
                }
                if (type === 'stock_aging' && d.buckets?.length) {
                    const ctx = document.getElementById('reportChart');
                    if (ctx) {
                        if (chartRef.current) chartRef.current.destroy();
                        chartRef.current = new Chart(ctx, { type: 'doughnut', data: { labels: d.buckets.map(b => b.label), datasets: [{ data: d.buckets.map(b => b.count), backgroundColor: ['#2e7d32', '#e65100', '#c62828', '#b71c1c'], borderWidth: 2, borderColor: '#fff', hoverOffset: 8 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '60%', plugins: { legend: { position: 'bottom' } } } });
                    }
                }

                const items = d.items || d.customers || d.categories_rep || [];
                if ((type === 'customer_profit' || type === 'category_report') && items.length) {
                    const tid = '#reportTable';
                    if (tableRef.current) { try { tableRef.current.destroy(); $(tid).empty(); } catch (e) { } }
                    setTimeout(() => {
                        try {
                            const cols = type === 'customer_profit' ? [
                                { data: 'name', title: 'Customer', render: (d) => '<strong>' + d + '</strong>' },
                                { data: 'phone', title: 'Phone', render: (d) => d || '—' },
                                { data: 'saleCount', title: 'Sales', className: 'dt-center' },
                                { data: 'totalSales', title: 'Revenue', render: (d) => '<strong>' + CS() + (d || 0).toLocaleString() + '</strong>' },
                                { data: 'avgTicket', title: 'Avg Ticket', render: (d) => CS() + Math.round(d || 0).toLocaleString() }
                            ] : [
                                { data: 'name', title: 'Category', render: (d) => '<strong>' + d + '</strong>' },
                                { data: 'totalQty', title: 'Total Qty', className: 'dt-center' },
                                { data: 'purchaseCost', title: 'Cost', render: (d) => CS() + (d || 0).toLocaleString() },
                                { data: 'salesRevenue', title: 'Revenue', render: (d) => '<strong>' + CS() + (d || 0).toLocaleString() + '</strong>' },
                                { data: 'profit', title: 'Profit', render: (d) => '<span class="' + (d >= 0 ? 'paid-amount' : 'due-amount') + '">' + CS() + Math.round(d || 0).toLocaleString() + '</span>' }
                            ];
                            tableRef.current = $(tid).DataTable({ data: items, destroy: true, columns: cols, pageLength: 25, responsive: true, dom: 'Blfrtip', buttons: [{ extend: 'csv', text: 'CSV' }, { extend: 'print', text: 'Print' }], order: [[cols.length - 1, 'desc']] });
                        } catch (e) { }
                    }, 50);
                }

                if (type === 'stock_aging' && d.oldStock?.length) {
                    const tid = '#reportTable';
                    if (tableRef.current) { try { tableRef.current.destroy(); $(tid).empty(); } catch (e) { } }
                    setTimeout(() => {
                        try {
                            tableRef.current = $(tid).DataTable({
                                data: d.oldStock, destroy: true, columns: [
                                    { data: 'item_name', title: 'Item Name', render: (d) => '<strong>' + d + '</strong>' },
                                    { data: 'category_name', title: 'Category' },
                                    { data: 'days', title: 'Days', render: (d) => '<span class="due-amount">' + d + ' days</span>' },
                                    { data: 'qty', title: 'Qty', render: (d) => (d || 1) },
                                    { data: 'sell_price', title: 'Value', render: (d) => CS() + (d || 0).toLocaleString() }
                                ], pageLength: 25, responsive: true, dom: 'Blfrtip', buttons: [{ extend: 'csv', text: 'CSV' }, { extend: 'print', text: 'Print' }], order: [[2, 'desc']]
                            });
                        } catch (e) { }
                    }, 50);
                }
            };

            return (
                <div>
                    <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap', marginBottom: '20px' }}>
                        {reports.map(r => (
                            <button key={r.id} className={'btn btn-sm ' + (activeReport === r.id ? 'btn-primary' : 'btn-secondary')} style={activeReport === r.id ? { background: r.color, borderColor: r.color } : {}} onClick={() => setActiveReport(r.id)}>
                                <i className={r.icon} style={{ marginRight: '6px' }}></i>{r.label}
                            </button>
                        ))}
                    </div>
                    {activeReport !== 'stock_aging' && (
                        <div className="filters-section" style={{ marginBottom: '20px', padding: '14px 16px' }}>
                            <div className="filters-header" style={{ marginBottom: '12px', paddingBottom: '10px' }}><h3 style={{ fontSize: '15px' }}><i className="fas fa-calendar-alt"></i> Date Range</h3><button className="btn btn-primary btn-sm" onClick={loadReport}><i className="fas fa-sync-alt"></i> Generate</button></div>
                            <div className="filters-grid" style={{ gap: '12px' }}>
                                <div className="filter-group"><label><i className="fas fa-calendar"></i> From</label><input type="date" className="filter-input" value={filters.dateFrom} onChange={(e) => setFilters({ ...filters, dateFrom: e.target.value })} /></div>
                                <div className="filter-group"><label><i className="fas fa-calendar"></i> To</label><input type="date" className="filter-input" value={filters.dateTo} onChange={(e) => setFilters({ ...filters, dateTo: e.target.value })} /></div>
                            </div>
                        </div>
                    )}
                    {activeReport === 'stock_aging' && (
                        <div style={{ marginBottom: '16px', textAlign: 'right' }}><button className="btn btn-primary btn-sm" onClick={loadReport}><i className="fas fa-sync-alt"></i> Refresh</button></div>
                    )}

                    {loading && (
                        <div style={{ padding: '60px 20px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '12px' }}>
                            <div className="loading-progress" style={{ width: '200px' }}><div className="loading-progress-bar"></div></div>
                            <span style={{ fontSize: '14px', color: '#888' }}>Generating report...</span>
                        </div>
                    )}

                    {!loading && data && (
                        <div>
                            {activeReport === 'profit_loss' && (
                                <div>
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: '12px', marginBottom: '20px' }}>
                                        <div className="stat-card" style={{ borderLeftColor: '#2e7d32' }}><div className="stat-card-icon" style={{ background: '#34a853', width: '45px', height: '45px', fontSize: '20px' }}><i className="fas fa-arrow-up"></i></div><div className="stat-card-value" style={{ fontSize: '22px' }}>{CS()}{(data.totalSales || 0).toLocaleString()}</div><div className="stat-card-label">Sales ({data.salesCount || 0})</div></div>
                                        <div className="stat-card" style={{ borderLeftColor: '#1565c0' }}><div className="stat-card-icon" style={{ background: '#1565c0', width: '45px', height: '45px', fontSize: '20px' }}><i className="fas fa-arrow-down"></i></div><div className="stat-card-value" style={{ fontSize: '22px' }}>{CS()}{(data.totalPurchases || 0).toLocaleString()}</div><div className="stat-card-label">Purchases ({data.purchasesCount || 0})</div></div>
                                        <div className="stat-card" style={{ borderLeftColor: '#c62828' }}><div className="stat-card-icon" style={{ background: '#ea4335', width: '45px', height: '45px', fontSize: '20px' }}><i className="fas fa-receipt"></i></div><div className="stat-card-value" style={{ fontSize: '22px' }}>{CS()}{(data.totalExpenses || 0).toLocaleString()}</div><div className="stat-card-label">Expenses</div></div>
                                        <div className="stat-card" style={{ borderLeftColor: '#e65100' }}><div className="stat-card-icon" style={{ background: '#fbbc04', width: '45px', height: '45px', fontSize: '20px' }}><i className="fas fa-chart-line"></i></div><div className="stat-card-value" style={{ fontSize: '22px' }}>{CS()}{(data.grossProfit || 0).toLocaleString()}</div><div className="stat-card-label">Gross Profit</div></div>
                                        <div className="stat-card" style={{ borderLeftColor: (data.netProfit || 0) >= 0 ? '#2e7d32' : '#c62828' }}><div className="stat-card-icon" style={{ background: (data.netProfit || 0) >= 0 ? '#34a853' : '#ea4335', width: '45px', height: '45px', fontSize: '20px' }}><i className="fas fa-coins"></i></div><div className="stat-card-value" style={{ fontSize: '22px', color: (data.netProfit || 0) >= 0 ? '#2e7d32' : '#c62828' }}>{CS()}{(data.netProfit || 0).toLocaleString()}</div><div className="stat-card-label">Net Profit</div></div>
                                    </div>
                                    {data.dailyData?.length > 0 && <div className="data-section" style={{ padding: '16px' }}><h3 style={{ fontSize: '14px', fontWeight: '700', color: 'var(--navy-primary)', marginBottom: '12px' }}><i className="fas fa-chart-bar"></i> Daily Breakdown</h3><div style={{ height: '280px' }}><canvas id="reportChart"></canvas></div></div>}
                                </div>
                            )}

                            {activeReport === 'sales_summary' && (
                                <div>
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '12px', marginBottom: '20px' }}>
                                        <div className="stat-card" style={{ borderLeftColor: '#2e7d32' }}><div className="stat-card-icon" style={{ background: '#34a853', width: '45px', height: '45px', fontSize: '20px' }}><i className="fas fa-coins"></i></div><div className="stat-card-value" style={{ fontSize: '22px' }}>{CS()}{(data.totalAmount || 0).toLocaleString()}</div><div className="stat-card-label">Total Sales</div></div>
                                        <div className="stat-card" style={{ borderLeftColor: 'var(--navy-primary)' }}><div className="stat-card-icon" style={{ background: 'var(--navy)', width: '45px', height: '45px', fontSize: '20px' }}><i className="fas fa-shopping-bag"></i></div><div className="stat-card-value" style={{ fontSize: '22px' }}>{data.totalCount || 0}</div><div className="stat-card-label">Total Orders</div></div>
                                        <div className="stat-card" style={{ borderLeftColor: '#6f42c1' }}><div className="stat-card-icon" style={{ background: '#6f42c1', width: '45px', height: '45px', fontSize: '20px' }}><i className="fas fa-ticket-alt"></i></div><div className="stat-card-value" style={{ fontSize: '22px' }}>{CS()}{Math.round(data.avgTicket || 0).toLocaleString()}</div><div className="stat-card-label">Avg Ticket</div></div>
                                    </div>
                                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '20px' }}>
                                        <div className="data-section" style={{ padding: '16px' }}><h3 style={{ fontSize: '14px', fontWeight: '700', color: 'var(--navy-primary)', marginBottom: '8px' }}><i className="fas fa-credit-card"></i> Payment Methods</h3>{data.methodBreakdown && Object.entries(data.methodBreakdown).sort((a, b) => b[1] - a[1]).map(([m, amt]) => <div key={m} style={{ display: 'flex', justifyContent: 'space-between', padding: '6px 0', borderBottom: '1px solid #f5f5f5', fontSize: '13px' }}><span className="pay-method active" style={{ fontSize: '11px', padding: '3px 10px', cursor: 'default' }}>{m}</span><strong>{CS()}{Math.round(amt).toLocaleString()}</strong></div>)}</div>
                                        <div className="data-section" style={{ padding: '16px' }}><h3 style={{ fontSize: '14px', fontWeight: '700', color: 'var(--navy-primary)', marginBottom: '8px' }}><i className="fas fa-flag"></i> Status</h3>{data.statusBreakdown && Object.entries(data.statusBreakdown).map(([s, info]) => <div key={s} style={{ display: 'flex', justifyContent: 'space-between', padding: '6px 0', borderBottom: '1px solid #f5f5f5', fontSize: '13px' }}><span className={'pur-status pur-' + s}>{s}</span><span>{info.count} orders — <strong>{CS()}{Math.round(info.amount).toLocaleString()}</strong></span></div>)}</div>
                                    </div>
                                    {data.groupedData?.length > 0 && <div className="data-section" style={{ padding: '16px' }}><h3 style={{ fontSize: '14px', fontWeight: '700', color: 'var(--navy-primary)', marginBottom: '12px' }}><i className="fas fa-chart-line"></i> Trend</h3><div style={{ height: '250px' }}><canvas id="reportChart"></canvas></div></div>}
                                </div>
                            )}

                            {activeReport === 'stock_aging' && (
                                <div>
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '12px', marginBottom: '20px' }}>
                                        {(data.buckets || []).map((b, i) => {
                                            const colors = ['#2e7d32', '#e65100', '#c62828', '#b71c1c'];
                                            return <div key={i} className="stat-card" style={{ borderLeftColor: colors[i] }}><div className="stat-card-icon" style={{ background: colors[i], width: '45px', height: '45px', fontSize: '18px' }}><i className="fas fa-cubes"></i></div><div className="stat-card-value" style={{ fontSize: '22px' }}>{b.count}</div><div className="stat-card-label">{b.label} ({CS()}{Math.round(b.value).toLocaleString()})</div></div>;
                                        })}
                                    </div>
                                    <div style={{ display: 'grid', gridTemplateColumns: '250px 1fr', gap: '16px' }}>
                                        <div className="data-section" style={{ padding: '16px', height: 'fit-content' }}><h3 style={{ fontSize: '14px', fontWeight: '700', color: 'var(--navy-primary)', marginBottom: '12px' }}><i className="fas fa-chart-pie"></i> Distribution</h3><div style={{ height: '200px' }}><canvas id="reportChart"></canvas></div></div>
                                        <div className="data-section" style={{ padding: '16px' }}><h3 style={{ fontSize: '14px', fontWeight: '700', color: 'var(--navy-primary)', marginBottom: '12px' }}><i className="fas fa-exclamation-triangle" style={{ color: '#c62828' }}></i> Old Stock (90+ days)</h3>{data.oldStock?.length > 0 ? <table id="reportTable" className="display" style={{ width: '100%' }}></table> : <div className="empty-state"><i className="fas fa-check-circle" style={{ color: '#2e7d32' }}></i><p>No stock older than 90 days</p></div>}</div>
                                    </div>
                                </div>
                            )}

                            {activeReport === 'customer_profit' && (
                                <div>
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '12px', marginBottom: '20px' }}>
                                        <div className="stat-card" style={{ borderLeftColor: '#6f42c1' }}><div className="stat-card-icon" style={{ background: '#6f42c1', width: '45px', height: '45px', fontSize: '20px' }}><i className="fas fa-users"></i></div><div className="stat-card-value" style={{ fontSize: '22px' }}>{data.customers?.length || 0}</div><div className="stat-card-label">Active Customers</div></div>
                                        <div className="stat-card" style={{ borderLeftColor: '#2e7d32' }}><div className="stat-card-icon" style={{ background: '#34a853', width: '45px', height: '45px', fontSize: '20px' }}><i className="fas fa-coins"></i></div><div className="stat-card-value" style={{ fontSize: '22px' }}>{CS()}{(data.customers || []).reduce((s, c) => s + c.totalSales, 0).toLocaleString()}</div><div className="stat-card-label">Total Revenue</div></div>
                                        <div className="stat-card" style={{ borderLeftColor: 'var(--navy-primary)' }}><div className="stat-card-icon" style={{ background: 'var(--navy)', width: '45px', height: '45px', fontSize: '20px' }}><i className="fas fa-shopping-bag"></i></div><div className="stat-card-value" style={{ fontSize: '22px' }}>{(data.customers || []).reduce((s, c) => s + c.saleCount, 0)}</div><div className="stat-card-label">Total Orders</div></div>
                                    </div>
                                    <div className="data-section" style={{ padding: '16px' }}><table id="reportTable" className="display" style={{ width: '100%' }}></table></div>
                                </div>
                            )}

                            {activeReport === 'category_report' && (
                                <div>
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '12px', marginBottom: '20px' }}>
                                        <div className="stat-card" style={{ borderLeftColor: '#1565c0' }}><div className="stat-card-icon" style={{ background: '#1565c0', width: '45px', height: '45px', fontSize: '20px' }}><i className="fas fa-th-large"></i></div><div className="stat-card-value" style={{ fontSize: '22px' }}>{data.categories_rep?.length || 0}</div><div className="stat-card-label">Total Categories</div></div>
                                        <div className="stat-card" style={{ borderLeftColor: '#c62828' }}><div className="stat-card-icon" style={{ background: '#ea4335', width: '45px', height: '45px', fontSize: '20px' }}><i className="fas fa-coins"></i></div><div className="stat-card-value" style={{ fontSize: '22px' }}>{CS()}{(data.categories_rep || []).reduce((s, c) => s + c.purchaseCost, 0).toLocaleString()}</div><div className="stat-card-label">Total Cost</div></div>
                                        <div className="stat-card" style={{ borderLeftColor: '#2e7d32' }}><div className="stat-card-icon" style={{ background: '#34a853', width: '45px', height: '45px', fontSize: '20px' }}><i className="fas fa-chart-line"></i></div><div className="stat-card-value" style={{ fontSize: '22px', color: (data.categories_rep || []).reduce((s, c) => s + c.profit, 0) >= 0 ? '#2e7d32' : '#c62828' }}>{CS()}{(data.categories_rep || []).reduce((s, c) => s + c.profit, 0).toLocaleString()}</div><div className="stat-card-label">Total Profit</div></div>
                                    </div>
                                    <div className="data-section" style={{ padding: '16px' }}><table id="reportTable" className="display" style={{ width: '100%' }}></table></div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
