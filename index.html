                                    </div>
                                    <div style={{ marginTop: '20px' }}>
                                        <button className="btn btn-primary" onClick={() => setEditMode(true)}><i className="fas fa-edit"></i> Edit This Item</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    {load && <div className="loading-ov"><div className="loading-popup">Updating...</div></div>}
                </div>
            );
        }

        /* ── Bulk Import Modal ── */
        function BulkImportModal({ user, batches, onClose, onDone }) {
            const [step, setStep] = useState(1);
            const [catId, setCatId] = useState('');
            const [purchaseId, setPurchaseId] = useState('');
            const [buyRate, setBuyRate] = useState('0');
            const [sellRate, setSellRate] = useState('0');
            const [purchases, setPurchases] = useState([]);
            const [items, setItems] = useState([]);
            const [importing, setImporting] = useState(false);
            const [result, setResult] = useState(null);
            const fileRef = useRef(null);

            const catOpts = batches.map(c => ({ value: String(c.id), label: c.name }));

            useEffect(() => {
                if (catId) serverCall('getPurchasesForDropdown', parseInt(catId)).then(r => { if (r.success) setPurchases(r.data); });
                else setPurchases([]);
            }, [catId]);

            const handleFile = (file) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const lines = e.target.result.split('\n').filter(l => l.trim());
                    const parsed = [];
                    lines.forEach((line, i) => {
                        if (i === 0 && line.toLowerCase().includes('item_name')) return; // skip header
                        const parts = line.split(',').map(p => p.trim().replace(/"/g, ''));
                        if (parts.length >= 1) {
                            const item_name = parts[0], item_code = parts[1] || '', qty = parseInt(parts[2]) || 1, b_rate = parseFloat(parts[3]) || parseFloat(buyRate) || 0, s_rate = parseFloat(parts[4]) || parseFloat(sellRate) || 0;
                            const valid = !!item_name;
                            parsed.push({ item_name, item_code, qty, buy_rate: b_rate, sell_rate: s_rate, valid, reason: !item_name ? 'Empty Item Name' : '' });
                        }
                    });
                    setItems(parsed);
                    setStep(3);
                };
                reader.readAsText(file);
            };

            const doImport = async () => {
                setImporting(true);
                const validItems = items.filter(i => i.valid).map(i => ({ item_name: i.item_name, item_code: i.item_code, qty: i.qty, buy_rate: i.buy_rate, sell_rate: i.sell_rate }));
                const r = await serverCall('bulkImportItem', validItems, parseInt(catId), purchaseId ? parseInt(purchaseId) : '', parseFloat(buyRate) || 0, parseFloat(sellRate) || 0, user.id, user.role);
                setImporting(false);
                if (r.success) setResult(r.data);
                else Swal.fire({ icon: 'error', text: r.message });
            };

            const purOpts = purchases.map(p => ({ value: String(p.id), label: p.name }));

            return (
                <div style={{ maxWidth: '650px', margin: '0 auto' }}>
                    <div className="modal-header" style={{ background: 'transparent', color: 'var(--navy-primary)', padding: '0 0 15px', borderBottom: '2px solid var(--navy-primary)', marginBottom: '20px' }}>
                        <h3 style={{ margin: 0 }}><i className="fas fa-file-import"></i> Bulk Import Items</h3>
                    </div>
                    <div>
                        {!result ? (
                            <div>
                                <div className="dash-alert info" style={{ marginBottom: '15px' }}><i className="fas fa-info-circle dash-alert-ico"></i><div className="dash-alert-text">Uploading items with a matching <strong>name</strong> in the same category will increment their stock quantity rather than creating duplicates.</div></div>
                                <div className="import-step">
                                    <span className="import-step-num">1</span><strong>Select Category & Settings</strong>
                                    <div style={{ marginTop: '12px' }}>
                                        <SearchableDropdown label="Category *" icon="fas fa-th-large" options={catOpts} value={catId} onChange={setCatId} required />
                                        {purchases.length > 0 && <SearchableDropdown label="Link to Purchase" icon="fas fa-shopping-cart" options={purOpts} value={purchaseId} onChange={setPurchaseId} placeholder="Optional..." />}
                                        <div className="form-grid">
                                            <div className="form-group"><label>Default Buy Rate</label><input type="number" step="0.01" value={buyRate} onChange={(e) => setBuyRate(e.target.value)} /></div>
                                            <div className="form-group"><label>Default Sell Rate</label><input type="number" step="0.01" value={sellRate} onChange={(e) => setSellRate(e.target.value)} /></div>
                                        </div>
                                    </div>
                                </div>
                                <div className="import-step">
                                    <span className="import-step-num">2</span><strong>Upload CSV</strong>
                                    <p style={{ fontSize: '13px', color: '#888', margin: '8px 0' }}>Format: <strong>item_name, item_code, qty, buy_rate, sell_rate</strong></p>
                                    <a href="data:text/csv;charset=utf-8,item_name,item_code,qty,buy_rate,sell_rate%0APen,ITEM-001,5,100,150%0ANotebook,,10,,%0A" download="item_import_template.csv" className="btn btn-secondary btn-sm" style={{ marginBottom: '10px' }}><i className="fas fa-download"></i> Template</a>
                                    <div className={`upload-zone`} onClick={() => fileRef.current?.click()} onDragOver={(e) => e.preventDefault()} onDrop={(e) => { e.preventDefault(); if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); }}>
                                        <i className="fas fa-cloud-upload-alt" style={{ fontSize: '32px', color: '#ccc', marginBottom: '8px' }}></i>
                                        <p className="upload-hint">Drag CSV or click to browse</p>
                                    </div>
                                    <input ref={fileRef} type="file" accept=".csv,.txt" style={{ display: 'none' }} onChange={(e) => { if (e.target.files.length) handleFile(e.target.files[0]); }} />
                                </div>
                                {items.length > 0 && (
                                    <div className="import-step">
                                        <span className="import-step-num">3</span><strong>Preview ({items.filter(i => i.valid).length} valid)</strong>
                                        <div style={{ maxHeight: '200px', overflowY: 'auto', marginTop: '10px' }}>
                                            {items.slice(0, 20).map((item, i) => (
                                                <div key={i} className={'import-preview-row ' + (item.valid ? 'valid' : 'invalid')}>
                                                    <strong>{item.item_name || '(empty)'}</strong> {item.item_code && <span>({item.item_code})</span>} — Qty: {item.qty} | Buy: {item.buy_rate} | Sell: {item.sell_rate} {!item.valid && <span style={{ color: '#c62828', marginLeft: '8px' }}>{item.reason}</span>}
                                                </div>
                                            ))}
                                        </div>
                                        <button className="btn btn-success" style={{ marginTop: '12px' }} disabled={importing || !catId || items.filter(i => i.valid).length === 0} onClick={doImport}>
                                            {importing ? <><i className="fas fa-spinner fa-spin"></i> Importing...</> : <><i className="fas fa-check"></i> Import {items.filter(i => i.valid).length} Items</>}
                                        </button>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div style={{ textAlign: 'center', padding: '20px' }}>
                                <i className="fas fa-check-circle" style={{ fontSize: '48px', color: '#2e7d32', marginBottom: '16px' }}></i>
                                <h3 style={{ marginBottom: '12px' }}>Import Complete</h3>
                                <p><span className="paid-amount" style={{ fontSize: '20px' }}>{result.success}</span> items processed successfully</p>
                                {result.failed > 0 && <p style={{ marginTop: '8px' }}><span className="due-amount" style={{ fontSize: '18px' }}>{result.failed}</span> failed</p>}
                                <button className="btn btn-primary" style={{ marginTop: '20px' }} onClick={onDone}><i className="fas fa-check"></i> Done</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        /* ── POS View ── */
        function POSView({ user }) {
            const [cart, setCart] = useState([]);
            const [allItem, setAllItem] = useState([]);
            const [categories, setCategories] = useState([]);
            const [customers, setCustomers] = useState([]);
            const [searchQ, setSearchQ] = useState('');
            const [filterCat, setFilterCat] = useState('');
            const [customerId, setCustomerId] = useState('');
            const [discount, setDiscount] = useState('0');
            const [paidAmt, setPaidAmt] = useState('');
            const [payMethod, setPayMethod] = useState('cash');
            const [payRef, setPayRef] = useState('');
            const [notes, setNotes] = useState('');
            const [itemLoading, setItemLoading] = useState(true);
            const [load, setLoad] = useState('');
            const [showInvoice, setShowInvoice] = useState(null);
            const [qtyPickItem, setQtyPickItem] = useState(null);

            const searchRef = useRef(null);

            useEffect(() => {
                loadData();
                setTimeout(() => searchRef.current?.focus(), 300);
            }, []);

            const loadData = async () => {
                setItemLoading(true);
                try {
                    const [itRes, catRes, cuRes] = await Promise.all([
                        serverCall('getAvailableItem', 0),
                        serverCall('getCategoriesForDropdown'),
                        serverCall('getCustomersForDropdown')
                    ]);
                    if (itRes.success) setAllItem(itRes.data);
                    if (catRes.success) setCategories(catRes.data);
                    if (cuRes.success) setCustomers(cuRes.data);
                } catch (e) { }
                setItemLoading(false);
            };

            const displayItems = React.useMemo(() => {
                return allItem.filter(item => {
                    const matchesCat = filterCat ? String(item.category_id) === filterCat : true;
                    const matchesSearch = item.item_name.toLowerCase().includes(searchQ.toLowerCase()) || (item.item_code && item.item_code.toLowerCase().includes(searchQ.toLowerCase()));
                    const notInCart = !cart.some(c => c.item_stock_id === item.id);
                    return matchesCat && matchesSearch && notInCart;
                });
            }, [allItem, cart, filterCat, searchQ]);

            const addToCart = (item) => {
                if (item.qty > 1) setQtyPickItem(item);
                else doAddToCart(item, 1);
            };

            const doAddToCart = (item, q) => {
                const qty = parseInt(q) || 1;
                const newItem = {
                    item_stock_id: item.id,
                    item_code: item.item_code,
                    item_name: item.item_name,
                    qty: qty,
                    max_qty: item.qty || 1,
                    rate: item.sell_rate,
                    line_total: qty * item.sell_rate,
                    category_name: item.category_name
                };
                setCart([...cart, newItem]);
                setSearchQ('');
                searchRef.current?.focus();
            };

            const updateCartQty = (idx, newQty) => {
                const nextCart = [...cart];
                const item = nextCart[idx];
                const q = Math.max(1, Math.min(parseInt(newQty) || 1, item.max_qty));
                item.qty = q;
                item.line_total = q * item.rate;
                setCart(nextCart);
            };

            const removeFromCart = (idx) => setCart(cart.filter((_, i) => i !== idx));

            const subtotal = cart.reduce((s, i) => s + i.line_total, 0);
            const disc = parseFloat(discount) || 0;
            const grandTotal = Math.round((subtotal - disc) * 100) / 100;
            const paid = parseFloat(paidAmt) || 0;
            const due = Math.round((grandTotal - paid) * 100) / 100;

            const handleSale = async (status) => {
                if (!cart.length) return Swal.fire('Wait!', 'Add items to cart first.', 'warning');
                setLoad(status === 'pending' ? 'Holding Sale...' : 'Completing Sale...');
                try {
                    const payload = { customer_id: customerId, items: cart, discount: disc, paid_amount: status === 'pending' ? 0 : paid, payment_method: payMethod, payment_reference: payRef, notes: notes, status: status };
                    const r = await serverCall('completeSale', payload, user.id, user.role);
                    setLoad('');
                    if (r.success) {
                        if (status === 'completed') {
                            setShowInvoice({ invoice_no: r.data.invoice_no, customer: customers.find(c => c.id == customerId)?.name || 'Walk-in', items: cart, subtotal, discount: disc, grandTotal, paid, due, payMethod, date: new Date().toISOString() });
                        } else Swal.fire('Success', 'Sale held as pending.', 'success');
                        setCart([]); setDiscount('0'); setPaidAmt(''); setCustomerId(''); setPayRef(''); setNotes('');
                        loadData();
                    } else Swal.fire('Error', r.message, 'error');
                } catch (e) { setLoad(''); Swal.fire('Error', 'Something went wrong', 'error'); }
            };

            const catOptions = categories.map(c => ({ value: String(c.id), label: c.name }));
            const custOptions = customers.map(c => ({ value: String(c.id), label: c.name }));

            return (
                <div className="pos-layout">
                    <div className="pos-left">
                        <div className="filters-section" style={{ marginBottom: '15px', padding: '10px' }}>
                            <div className="filters-grid" style={{ gap: '10px' }}>
                                <SearchableDropdown label="Category" options={catOptions} value={filterCat} onChange={setFilterCat} placeholder="All Categories" icon="fas fa-th-large" />
                                <div className="pos-search" style={{ marginBottom: 0, display: 'flex', alignItems: 'center', background: '#f0f0f0', padding: '5px 10px', borderRadius: '4px' }}>
                                    <i className="fas fa-search search-icon"></i>
                                    <input ref={searchRef} type="text" value={searchQ} onChange={e => setSearchQ(e.target.value)} placeholder="Search name or code..." autoComplete="off" />
                                </div>
                            </div>
                        </div>

                        {itemLoading ? <div className="empty-state"><i className="fas fa-spinner fa-spin"></i><p>Loading items...</p></div> : displayItems.length > 0 ? (
                            <div className="pos-product-grid">
                                {displayItems.map(item => (
                                    <div key={item.id} className="pos-product-card" onClick={() => addToCart(item)}>
                                        {item.qty > 1 && <span className="ppc-qty-badge">{item.qty}</span>}
                                        {item.image ? <img src={'https://lh3.google.com/u/0/d/' + item.image} className="ppc-img" /> : <div className="ppc-img-ph"><i className="fas fa-image"></i></div>}
                                        <div className="ppc-serial">{item.item_name}</div>
                                        {item.item_code && <div className="ppc-cft">{item.item_code}</div>}
                                        <div className="ppc-meta">{item.category_name}</div>
                                        <div className="ppc-price">{CS()}{item.sell_rate.toLocaleString()}</div>
                                    </div>
                                ))}
                            </div>
                        ) : <div className="empty-state"><i className="fas fa-box-open"></i><p>No items found</p></div>}
                    </div>

                    <div className="pos-right">
                        <div className="pos-pane">
                            <div className="pos-pane-title"><i className="fas fa-shopping-cart"></i> Cart Summary ({cart.length})</div>
                            <div style={{ maxHeight: '200px', overflowY: 'auto', marginBottom: '10px' }}>
                                <table className="cart-table">
                                    <thead><tr><th>Item</th><th>Qty</th><th>Total</th><th></th></tr></thead>
                                    <tbody>
                                        {cart.map((item, i) => (
                                            <tr key={i}>
                                                <td><small>{item.item_name}</small></td>
                                                <td><input type="number" className="cart-rate" style={{ width: '45px' }} value={item.qty} onChange={e => updateCartQty(i, e.target.value)} /></td>
                                                <td>{item.line_total.toLocaleString()}</td>
                                                <td><button onClick={() => removeFromCart(i)} className="cart-remove">&times;</button></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                {cart.length === 0 && <p style={{ textAlign: 'center', color: '#ccc', padding: '10px' }}>Cart is empty</p>}
                            </div>
                        </div>

                        <div className="pos-pane">
                            <div className="pos-pane-title"><i className="fas fa-user"></i> Customer</div>
                            <SearchableDropdown options={custOptions} value={customerId} onChange={setCustomerId} placeholder="Walk-in Customer" />
                        </div>

                        <div className="pos-pane">
                            <div className="pos-line"><span>Subtotal</span><span>{CS()}{subtotal.toLocaleString()}</span></div>
                            <div className="pos-line"><span>Discount</span><input type="number" className="pos-line-input" value={discount} onChange={e => setDiscount(e.target.value)} /></div>
                            <div className="pos-grand"><div className="pos-grand-lbl">Grand Total</div><div className="pos-grand-val">{CS()}{grandTotal.toLocaleString()}</div></div>

                            <div className="pos-quick-pay" style={{ marginTop: '10px' }}>
                                <button className="pos-quick-btn full" onClick={() => setPaidAmt(String(grandTotal))}>Full Paid</button>
                                <button className="pos-quick-btn" onClick={() => setPaidAmt('0')}>Clear</button>
                            </div>
                            <div className="pos-line" style={{ marginTop: '10px' }}>
                                <span>Paid Amount</span>
                                <input type="number" className="pos-line-input" value={paidAmt} onChange={e => setPaidAmt(e.target.value)} placeholder={grandTotal} />
                            </div>
                            <div className={due > 0 ? "pos-due-callout has" : "pos-due-callout zero"}>
                                <span className="pos-due-callout-lbl">{due > 0 ? 'Due' : 'Paid'}</span>
                                <span className="pos-due-callout-val">{CS()}{Math.abs(due).toLocaleString()}</span>
                            </div>
                        </div>

                        <div className="pos-pane">
                            <div className="pos-pane-title"><i className="fas fa-credit-card"></i> Method</div>
                            <div className="pos-pay-grid">
                                {['cash', 'bkash', 'bank', 'nagad'].map(m => (
                                    <button key={m} className={'pos-pay-tile ' + (payMethod === m ? 'active' : '')} onClick={() => setPayMethod(m)}><div className="pos-pay-tile-lbl">{m.toUpperCase()}</div></button>
                                ))}
                            </div>
                        </div>

                        <div className="pos-action-bar">
                            <button className="btn btn-warning" onClick={() => handleSale('pending')} disabled={!cart.length}><i className="fas fa-pause"></i> Hold</button>
                            <button className="btn btn-success" onClick={() => handleSale('completed')} disabled={!cart.length}><i className="fas fa-print"></i> Checkout</button>
                        </div>
                    </div>

                    {qtyPickItem && <QtyPickerModal item={qtyPickItem} onClose={() => setQtyPickItem(null)} onConfirm={(q) => { doAddToCart(qtyPickItem, q); setQtyPickItem(null); }} />}
                    {showInvoice && <InvoicePrintModal data={showInvoice} onClose={() => setShowInvoice(null)} />}
                    {load && <div className="loading-ov"><div className="loading-popup"><div className="loading-progress"><div className="loading-progress-bar"></div></div><div className="loading-txt">{load}</div></div></div>}
                </div>
            );
        }

        function QtyPickerModal({ item, onClose, onConfirm }) {
            const max = item.qty || 1;
            const [qty, setQty] = useState('1');
            const [err, setErr] = useState('');
            const inputRef = useRef(null);

            useEffect(() => { setTimeout(() => { inputRef.current?.focus(); inputRef.current?.select(); }, 100); }, []);

            const handleSubmit = (e) => {
                e.preventDefault();
                const n = parseInt(qty);
                if (!n || n < 1) { setErr('Enter at least 1'); return; }
                if (n > max) { setErr('Max ' + max + ' available'); return; }
                onConfirm(n);
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" style={{ maxWidth: '420px' }} onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header"><h3><i className="fas fa-cart-plus"></i> Item Quantity</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
                        <div className="modal-body">
                            <div style={{ textAlign: 'center', marginBottom: '18px', padding: '14px', background: '#f8f9fa', borderRadius: '4px', border: '1px solid #e8e8e8' }}>
                                <div style={{ fontSize: '16px', fontWeight: '700', color: 'var(--navy-primary)' }}>{item.item_name}</div>
                                {item.item_code && <div style={{ fontSize: '13px', color: '#666' }}>{item.item_code}</div>}
                                <div style={{ fontSize: '12px', color: 'var(--navy-accent)', fontWeight: '600', marginTop: '6px' }}><i className="fas fa-cubes"></i> Available: {max}</div>
                            </div>
                            <form onSubmit={handleSubmit}>
                                <div className="form-group"><label>Quantity *</label><input ref={inputRef} type="number" min="1" max={max} step="1" value={qty} onChange={(e) => { setQty(e.target.value); setErr(''); }} required />{err && <div className="field-error">{err}</div>}</div>
                                <div className="form-actions"><button type="submit" className="btn btn-primary"><i className="fas fa-check"></i> Add</button><button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button></div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        /* ── Sales List ── */
        function SalesListView({ user, onNavigate }) {
            const _c = swrGet('sales');
            const [loading, setLoading] = useState(!_c);
            const [sales, setSales] = useState(_c || []);
            const [load, setLoad] = useState('');
            const [editingSale, setEditingSale] = useState(null);
            const [paySale, setPaySale] = useState(null);
            const [printSale, setPrintSale] = useState(null);
            const [customers, setCustomers] = useState([]);
            const tableRef = useRef(null);
            const [filters, setFilters] = useState({ customer: '', status: '', method: '', dateFrom: '', dateTo: '' });
            const canEdit = user.role === 'admin' || user.role === 'manager';
            const canDelete = user.role === 'admin';

            useEffect(() => {
                if (_c) setTimeout(() => initTable(_c), 150);
                loadSales();
                serverCall('getCustomersForDropdown').then(r => { if (r.success) setCustomers(r.data); });
                return () => { dtCleanup(); if (tableRef.current) { try { tableRef.current.destroy(); tableRef.current = null; } catch (e) { } } };
            }, []);

            const loadSales = async () => {
                if (!_c) setLoading(true);
                try {
                    const r = await serverCall('getSales', user.id, user.role);
                    setLoading(false);
                    if (r.success) { swrSet('sales', r.data); setSales(r.data); initTable(r.data); }
                } catch (e) { setLoading(false); }
            };

            const initTable = (data) => {
                if (tableRef.current) { try { tableRef.current.destroy(); tableRef.current = null; $('#salesTable').empty(); } catch (e) { } }
                setTimeout(() => {
                    try {
                        const t = $('#salesTable').DataTable({
                            data, destroy: true,
                            columns: [
                                { data: 'invoice_no', title: 'Invoice', render: (d) => '<strong>' + d + '</strong>' },
                                { data: 'customer_name', title: 'Customer' },
                                { data: 'total_items', title: 'Items', className: 'dt-center', render: (d) => '<span class="piece-badge total">' + d + '</span>' },
                                { data: 'grand_total', title: 'Total (TK)', render: (d) => '<strong>' + CS() + (d || 0).toLocaleString() + '</strong>' },
                                { data: 'paid_amount', title: 'Paid', render: (d) => '<span class="paid-amount">' + CS() + (d || 0).toLocaleString() + '</span>' },
                                { data: 'due_amount', title: 'Due', render: (d) => d > 0 ? '<span class="due-amount">' + CS() + d.toLocaleString() + '</span>' : '<span style="color:#aaa">0</span>' },
                                { data: 'payment_method', title: 'Method', render: (d) => '<span class="pay-method active" style="font-size:11px;padding:3px 8px;cursor:default">' + d + '</span>' },
                                { data: 'status', title: 'Status', render: (d) => '<span class="pur-status pur-' + (d === 'completed' ? 'completed' : d === 'pending' ? 'pending' : 'cancelled') + '">' + d + '</span>' },
                                { data: 'sale_date', title: 'Date', render: (d) => fmtDateShort(d) },
                                {
                                    data: null, title: 'Actions', orderable: false, width: '160px', render: (_, __, row) => {
                                        let h = '';
                                        if (row.status !== 'cancelled') h += '<button class="action-icon" data-action="cancel_sale" title="Cancel Sale" style="color:#e65100"><i class="fas fa-ban"></i></button>';
                                        h += '<button class="action-icon" data-action="print" title="Print Receipt" style="color:var(--navy-primary)"><i class="fas fa-print"></i></button>';
                                        if (row.due_amount > 0 && row.status !== 'cancelled' && row.customer_id) h += '<button class="action-icon" data-action="pay" title="Receive Payment" style="color:#2e7d32"><i class="fas fa-hand-holding-usd"></i></button>';
                                        if (canEdit && row.status !== 'cancelled') h += '<button class="action-icon edit-icon" data-action="edit" title="Edit"><i class="fas fa-edit"></i></button>';
                                        if (canDelete) h += '<button class="action-icon delete-icon" data-action="delete" title="Delete"><i class="fas fa-trash"></i></button>';
                                        return h;
                                    }
                                }
                            ],
                            pageLength: 10, responsive: true, dom: 'Blfrtip', buttons: ['csv', 'print'], order: [[8, 'desc']]
                        });
                        $('#salesTable').off('click', '.action-icon');
                        $('#salesTable').on('click', '.action-icon', function () {
                            if ($(this).hasClass('disabled')) return;
                            const action = $(this).data('action');
                            const row = t.row($(this).parents('tr')).data();
                            if (action === 'edit') setEditingSale(row);
                            else if (action === 'delete') handleDelete(row);
                            else if (action === 'cancel_sale') handleCancelSale(row);
                            else if (action === 'pay') setPaySale(row);
                            else if (action === 'print') handlePrint(row);
                        });
                        tableRef.current = t;
                    } catch (e) { console.error('salesTable:', e); }
                }, 150);
            };

            const handleDelete = (sale) => {
                Swal.fire({ icon: 'warning', title: 'Delete Sale?', text: 'Permanently delete ' + sale.invoice_no + '?', showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Yes, Delete' }).then(async (res) => {
                    if (res.isConfirmed) {
                        setLoad('Deleting...');
                        const r = await serverCall('deleteSale', sale.id, user.id, user.role);
                        setLoad('');
                        if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 1500, showConfirmButton: false }); loadSales(); }
                        else Swal.fire({ icon: 'error', text: r.message });
                    }
                });
            };

            const handleCancelSale = (sale) => {
                Swal.fire({ icon: 'warning', title: 'Cancel Sale?', text: 'This will return items to stock.', input: 'text', inputPlaceholder: 'Reason for cancellation', showCancelButton: true, confirmButtonColor: '#e65100', confirmButtonText: 'Cancel Sale' }).then(async (res) => {
                    if (res.isConfirmed) {
                        setLoad('Cancelling sale...');
                        const r = await serverCall('cancelSale', sale.id, res.value || '', user.id, user.role);
                        setLoad('');
                        if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 1500, showConfirmButton: false }); loadSales(); }
                        else Swal.fire({ icon: 'error', text: r.message });
                    }
                });
            };

            const handlePrint = async (sale) => {
                setLoad('Loading invoice...');
                const r = await serverCall('getSaleDetail', sale.id, user.id, user.role);
                setLoad('');
                if (r.success) {
                    const d = r.data;
                    setPrintSale({ invoice_no: d.invoice_no, customer: d.customer_name, items: d.items, subtotal: d.subtotal, discount: d.discount, grandTotal: d.grand_total, paid: d.paid_amount, due: d.due_amount, payMethod: d.payment_method, notes: d.notes, date: d.sale_date });
                }
            };

            const applyFilters = () => {
                if (!tableRef.current) return;
                const dt = tableRef.current;
                while ($.fn.dataTable.ext.search.length > 0) $.fn.dataTable.ext.search.pop();
                if (filters.dateFrom || filters.dateTo) {
                    $.fn.dataTable.ext.search.push((s, sd, idx) => {
                        const row = dt.row(idx).data(); if (!row) return true;
                        const d = new Date(row.sale_date);
                        if (filters.dateFrom && d < new Date(filters.dateFrom)) return false;
                        if (filters.dateTo && d > new Date(filters.dateTo + 'T23:59:59')) return false;
                        return true;
                    });
                }
                dt.columns().search('');
                if (filters.status) dt.column(7).search(filters.status);
                dt.draw();
            };
            const clearFilters = () => { setFilters({ customer: '', status: '', method: '', dateFrom: '', dateTo: '' }); if (tableRef.current) { while ($.fn.dataTable.ext.search.length > 0) $.fn.dataTable.ext.search.pop(); tableRef.current.columns().search('').draw(); } };
            useEffect(() => { if (tableRef.current && sales.length > 0) applyFilters(); }, [filters]);

            return (
                <div className="data-section">
                    <div className="section-header"><h2><i className="fas fa-receipt"></i> Sales</h2></div>
                    {!loading && (
                        <div className="filters-section">
                            <div className="filters-header"><h3><i className="fas fa-filter"></i> Filters</h3><button className="btn btn-secondary btn-sm" onClick={clearFilters}><i className="fas fa-times-circle"></i> Clear</button></div>
                            <div className="filters-grid">
                                <SearchableDropdown label="Status" icon="fas fa-flag" options={[{ value: 'completed', label: 'Completed' }, { value: 'pending', label: 'Pending' }, { value: 'cancelled', label: 'Cancelled' }]} value={filters.status} onChange={(v) => setFilters({ ...filters, status: v })} placeholder="All Status" />
                                <div className="filter-group"><label><i className="fas fa-calendar-alt"></i> Date From</label><input type="date" className="filter-input" value={filters.dateFrom} onChange={(e) => setFilters({ ...filters, dateFrom: e.target.value })} /></div>
                                <div className="filter-group"><label><i className="fas fa-calendar-alt"></i> Date To</label><input type="date" className="filter-input" value={filters.dateTo} onChange={(e) => setFilters({ ...filters, dateTo: e.target.value })} /></div>
                            </div>
                        </div>
                    )}
                    {loading && <TableSkeleton rows={6} columns={10} />}
                    <div style={{ display: loading ? 'none' : 'block' }}><table id="salesTable" className="display" style={{ width: '100%' }}></table></div>
                    {editingSale && <SaleEditModal sale={editingSale} customers={customers} user={user} onClose={() => setEditingSale(null)} onSaved={() => { setEditingSale(null); loadSales(); }} />}
                    {paySale && <SalePayModal sale={paySale} user={user} onClose={() => setPaySale(null)} onSaved={() => { setPaySale(null); loadSales(); }} />}
                    {printSale && <InvoicePrintModal data={printSale} onClose={() => setPrintSale(null)} />}
                    {load && <div className="loading-ov"><div className="loading-popup"><div className="loading-progress"><div className="loading-progress-bar"></div></div><div className="loading-txt">{load}</div></div></div>}
                </div>
            );
        }

        function SaleEditModal({ sale, customers, user, onClose, onSaved }) {
            const [loading, setLoading] = useState(true);
            const [detail, setDetail] = useState(null);
            const [form, setForm] = useState({ customer_id: sale.customer_id ? String(sale.customer_id) : '', discount: '0', paid_amount: String(sale.paid_amount || 0), payment_method: sale.payment_method || 'cash', notes: sale.notes || '', status: sale.status || 'completed' });
            const [saving, setSaving] = useState(false);
            const [itemLoad, setItemLoad] = useState('');
            const [searchQ, setSearchQ] = useState('');
            const [searchResults, setSearchResults] = useState([]);
            const [searching, setSearching] = useState(false);
            const [showSearch, setShowSearch] = useState(false);
            const debRef = useRef(null);

            useEffect(() => { loadDetail(); }, []);

            const loadDetail = async () => {
                const r = await serverCall('getSaleDetail', sale.id, user.id, user.role);
                setLoading(false);
                if (r.success) {
                    setDetail(r.data);
                    setForm(f => ({ ...f, discount: String(r.data.discount || 0), paid_amount: String(r.data.paid_amount || 0), payment_method: r.data.payment_method || 'cash', notes: r.data.notes || '', customer_id: r.data.customer_id ? String(r.data.customer_id) : '', status: r.data.status || 'completed' }));
                }
            };

            const doSearch = (q) => {
                setSearchQ(q);
                if (debRef.current) clearTimeout(debRef.current);
                if (!q.trim()) { setSearchResults([]); return; }
                debRef.current = setTimeout(async () => {
                    setSearching(true);
                    const r = await serverCall('searchItemBySerial', q.trim(), 0);
                    setSearching(false);
                    if (r.success) setSearchResults(r.data);
                }, 300);
            };

            const handleAddItem = async (itemData) => {
                setItemLoad('Adding ' + itemData.item_name + '...');
                setSearchQ(''); setSearchResults([]);
                const r = await serverCall('addSaleItem', sale.id, itemData.id, itemData.sell_rate, user.id, user.role);
                setItemLoad('');
                if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 800, showConfirmButton: false }); loadDetail(); }
                else Swal.fire({ icon: 'error', text: r.message });
            };

            const handleRemoveItem = (item) => {
                Swal.fire({ icon: 'warning', title: 'Return Item?', text: 'Return ' + item.item_name + '? Item will be restored to stock.', input: 'text', inputPlaceholder: 'Reason (optional)', showCancelButton: true, confirmButtonColor: '#e65100', confirmButtonText: 'Return' }).then(async (res) => {
                    if (res.isConfirmed) {
                        setItemLoad('Returning ' + item.item_name + '...');
                        const r = await serverCall('returnSaleItem', item.id, sale.id, res.value || '', user.id, user.role);
                        setItemLoad('');
                        if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 800, showConfirmButton: false }); loadDetail(); }
                        else Swal.fire({ icon: 'error', text: r.message });
                    }
                });
            };

            const subtotal = detail ? (detail.subtotal || detail.items.reduce((s, i) => s + (i.total || 0), 0)) : 0;
            const disc = parseFloat(form.discount) || 0;
            const grandTotal = Math.round((subtotal - disc) * 100) / 100;
            const paid = Math.min(parseFloat(form.paid_amount) || 0, grandTotal);
            const due = Math.round((grandTotal - paid) * 100) / 100;

            const custOpts = customers.map(c => ({ value: String(c.id), label: c.name }));
            const methods = ['cash', 'bank', 'bkash', 'nagad', 'cheque', 'credit'];
            const statusOpts = [{ value: 'completed', label: 'Completed' }, { value: 'pending', label: 'Pending' }];

            const handleSubmit = async (e) => {
                e.preventDefault();
                setSaving(true);
                const r = await serverCall('updateSale', { id: sale.id, customer_id: form.customer_id || '', discount: disc, paid_amount: paid, payment_method: form.payment_method, notes: form.notes, status: form.status }, user.id, user.role);
                setSaving(false);
                if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 1500, showConfirmButton: false }); onSaved(); }
                else Swal.fire({ icon: 'error', text: r.message });
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" style={{ maxWidth: '820px', maxHeight: '90vh', display: 'flex', flexDirection: 'column' }} onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header"><h3><i className="fas fa-edit"></i> Edit Sale — {sale.invoice_no}</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
                        <div className="modal-body" style={{ overflowY: 'auto', flex: 1 }}>
                            {loading ? (
                                <div style={{ padding: '40px 20px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '12px' }}>
                                    <div className="loading-progress" style={{ width: '200px' }}><div className="loading-progress-bar"></div></div>
                                </div>
                            ) : detail ? (
                                <div>
                                    {itemLoad && (
                                        <div style={{ marginBottom: '16px', padding: '10px 16px', background: '#f0f7ff', borderRadius: '4px', display: 'flex', alignItems: 'center', gap: '12px' }}>
                                            <div className="loading-progress" style={{ width: '120px' }}><div className="loading-progress-bar"></div></div>
                                            <span style={{ fontSize: '13px', color: 'var(--navy-accent)', fontWeight: '500' }}>{itemLoad}</span>
                                        </div>
                                    )}

                                    <div style={{ marginBottom: '20px' }}>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                                            <h4 style={{ fontSize: '14px', fontWeight: '700', color: 'var(--navy-primary)', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fas fa-box"></i> Sale Items ({detail.items.length})</h4>
                                            <button type="button" className="btn btn-success btn-sm" onClick={() => setShowSearch(!showSearch)}><i className={'fas ' + (showSearch ? 'fa-times' : 'fa-plus')}></i> {showSearch ? 'Close' : 'Add Item'}</button>
                                        </div>

                                        {detail.items.length > 0 ? (
                                            <div style={{ border: '1px solid #e0e0e0', borderRadius: '4px', overflowX: 'auto', marginBottom: '12px' }}>
                                                <table className="cart-table" style={{ marginBottom: 0 }}>
                                                    <thead><tr><th>#</th><th>Item</th><th>Qty</th><th>Rate</th><th>Total</th><th></th></tr></thead>
                                                    <tbody>
                                                        {detail.items.map((item, i) => (
                                                            <tr key={item.id || i}>
                                                                <td>{i + 1}</td>
                                                                <td><strong>{item.item_name}</strong> {item.item_code && <span style={{ fontSize: '11px', color: '#888' }}><br />{item.item_code}</span>}</td>
                                                                <td>{item.qty || 1}</td>
                                                                <td>{CS()}{(item.rate || 0).toLocaleString()}</td>
                                                                <td><strong>{CS()}{(item.total || 0).toLocaleString()}</strong></td>
                                                                <td>{detail.items.length > 1 && <button type="button" className="cart-remove" onClick={() => handleRemoveItem(item)} title="Return item"><i className="fas fa-times-circle"></i></button>}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        ) : (
                                            <div className="empty-state" style={{ padding: '16px' }}><i className="fas fa-inbox"></i><p>No items — add item to this sale</p></div>
                                        )}

                                        {showSearch && (
                                            <div style={{ border: '1px solid #e0e0e0', borderRadius: '4px', padding: '12px', background: '#fafafa' }}>
                                                <div className="pos-search" style={{ marginBottom: '8px' }}>
                                                    <i className="fas fa-search search-icon"></i>
                                                    <input type="text" value={searchQ} onChange={(e) => doSearch(e.target.value)} placeholder="Search name or code to add..." autoFocus autoComplete="off" />
                                                </div>
                                                <div style={{ maxHeight: '180px', overflowY: 'auto' }}>
                                                    {searching && <div style={{ padding: '10px', textAlign: 'center', color: '#888' }}><i className="fas fa-spinner fa-spin"></i> Searching...</div>}
                                                    {!searching && searchResults.length > 0 && searchResults.map((w, i) => (
                                                        <div key={i} className="pos-result-item" onClick={() => handleAddItem(w)}>
                                                            <div><span className="pos-result-serial">{w.item_name}{(w.qty || 1) > 1 ? ' ×' + w.qty : ''}</span><div className="pos-result-info">{w.category_name}</div></div>
                                                            <span className="pos-result-price">{CS()}{(w.sell_price || 0).toLocaleString()}</span>
                                                        </div>
                                                    ))}
                                                    {!searching && searchQ.length > 1 && searchResults.length === 0 && <div style={{ padding: '10px', textAlign: 'center', color: '#aaa' }}>No available item found</div>}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <form onSubmit={handleSubmit}>
                                        <div style={{ borderTop: '1px solid #e0e0e0', paddingTop: '16px' }}>
                                            <h4 style={{ fontSize: '14px', fontWeight: '700', color: 'var(--navy-primary)', marginBottom: '12px', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fas fa-sliders-h"></i> Sale Settings</h4>

                                            <div className="form-grid">
                                                <SearchableDropdown label="Customer" icon="fas fa-user" options={custOpts} value={form.customer_id} onChange={(v) => setForm({ ...form, customer_id: v })} placeholder="Walk-in Customer" />
                                                <SearchableDropdown label="Status" icon="fas fa-flag" options={statusOpts} value={form.status} onChange={(v) => setForm({ ...form, status: v })} placeholder="Status" />
                                            </div>

                                            <div className="form-grid">
                                                <div className="form-group"><label><i className="fas fa-tag"></i> Discount</label><input type="number" step="0.01" value={form.discount} onChange={(e) => setForm({ ...form, discount: e.target.value })} /></div>
                                                <div className="form-group"><label><i className="fas fa-money-bill-wave"></i> Paid Amount</label><input type="number" step="0.01" value={form.paid_amount} onChange={(e) => setForm({ ...form, paid_amount: e.target.value })} /></div>
                                            </div>

                                            <div className="calc-panel" style={{ marginBottom: '16px' }}>
                                                <div className="calc-row"><span className="calc-label">Subtotal ({detail.items.length} items)</span><span className="calc-val">{CS()}{Math.round(subtotal).toLocaleString()}</span></div>
                                                {disc > 0 && <div className="calc-row"><span className="calc-label">Discount</span><span className="calc-val" style={{ color: '#c62828' }}>-{CS()}{disc.toLocaleString()}</span></div>}
                                                <div className="calc-row"><span className="calc-label">Grand Total</span><span className="calc-val" style={{ fontWeight: '700', fontSize: '15px' }}>{CS()}{grandTotal.toLocaleString()}</span></div>
                                                <div className="calc-row"><span className="calc-label">Paid</span><span className="calc-val" style={{ color: '#2e7d32' }}>{CS()}{paid.toLocaleString()}</span></div>
                                                <div className="calc-row"><span className="calc-label">Due</span><span className={'calc-val' + (due > 0 ? ' due-amount' : '')}>{due > 0 ? CS() + due.toLocaleString() : '0'}</span></div>
                                            </div>

                                            <div>
                                                <label style={{ fontSize: '13px', fontWeight: '600', color: '#555', marginBottom: '8px', display: 'block' }}><i className="fas fa-credit-card"></i> Payment Method</label>
                                                <div className="pay-methods" style={{ marginBottom: '16px' }}>
                                                    {methods.map(m => <button key={m} type="button" className={'pay-method ' + (form.payment_method === m ? 'active' : '')} onClick={() => setForm({ ...form, payment_method: m })}>{m}</button>)}
                                                </div>
                                            </div>

                                            <div className="form-group"><label><i className="fas fa-sticky-note"></i> Notes</label><textarea rows="2" value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} style={{ resize: 'vertical' }}></textarea></div>

                                            <div className="form-actions">
                                                <button type="submit" className="btn btn-primary" disabled={saving || !!itemLoad}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> Save Changes</>}</button>
                                                <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            ) : null}
                        </div>
                    </div>
                </div>
            );
        }

        function SalePayModal({ sale, user, onClose, onSaved }) {
            const [loading, setLoading] = useState(true);
            const [detail, setDetail] = useState(null);
            const [form, setForm] = useState({ amount: '', method: 'cash', reference: '', payment_date: new Date().toISOString().split('T')[0], notes: '' });
            const [saving, setSaving] = useState(false);
            const methodOpts = [{ value: 'cash', label: 'Cash' }, { value: 'bank', label: 'Bank Transfer' }, { value: 'bkash', label: 'bKash' }, { value: 'nagad', label: 'Nagad' }, { value: 'cheque', label: 'Cheque' }];

            useEffect(() => {
                serverCall('getSaleDetail', sale.id, user.id, user.role).then(r => {
                    setLoading(false);
                    if (r.success) setDetail(r.data);
                });
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (parseFloat(form.amount) <= 0) { Swal.fire({ icon: 'warning', text: 'Enter valid amount' }); return; }
                if (detail && parseFloat(form.amount) > detail.due_amount) { Swal.fire({ icon: 'warning', text: 'Amount exceeds due' }); return; }
                setSaving(true);
                const r = await serverCall('addCustomerPayment', { customer_id: sale.customer_id, sale_id: sale.id, ...form }, user.id, user.role);
                setSaving(false);
                if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 1500, showConfirmButton: false }); onSaved(); }
                else Swal.fire({ icon: 'error', text: r.message });
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" style={{ maxWidth: '520px' }} onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header"><h3><i className="fas fa-hand-holding-usd"></i> Receive Payment</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
                        <div className="modal-body">
                            {loading ? <TableSkeleton rows={3} columns={3} /> : detail ? (
                                <div>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px', paddingBottom: '12px', borderBottom: '1px solid #f0f0f0' }}>
                                        <div><strong style={{ fontSize: '15px' }}>{detail.invoice_no}</strong><div style={{ fontSize: '13px', color: '#888', marginTop: '2px' }}>{detail.customer_name}</div></div>
                                        <span className={'pur-status pur-' + detail.status}>{detail.status}</span>
                                    </div>

                                    <div className="pay-remain">
                                        <div><div className="pay-remain-lbl">Remaining Due</div><div style={{ fontSize: '12px', color: '#888' }}>Total: {CS()}{detail.grand_total.toLocaleString()}</div></div>
                                        <div className="pay-remain-val">{CS()}{detail.due_amount.toLocaleString()}</div>
                                    </div>

                                    {detail.due_amount > 0 ? (
                                        <form onSubmit={handleSubmit}>
                                            <div className="form-grid">
                                                <div className="form-group"><label><i className="fas fa-money-bill-wave"></i> Amount *</label><input type="number" step="0.01" max={detail.due_amount} value={form.amount} onChange={(e) => setForm({ ...form, amount: e.target.value })} required /></div>
                                                <SearchableDropdown label="Method" icon="fas fa-credit-card" options={methodOpts} value={form.method} onChange={(v) => setForm({ ...form, method: v || 'cash' })} placeholder="Select..." />
                                            </div>
                                            <div className="form-group"><label><i className="fas fa-calendar-alt"></i> Date</label><input type="date" value={form.payment_date} onChange={(e) => setForm({ ...form, payment_date: e.target.value })} /></div>
                                            <div className="form-actions">
                                                <button type="submit" className="btn btn-success" disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i></> : <><i className="fas fa-check"></i> Record Payment</>}</button>
                                                <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
                                            </div>
                                        </form>
                                    ) : <div style={{ textAlign: 'center', padding: '16px', color: '#2e7d32' }}><i className="fas fa-check-circle" style={{ fontSize: '28px' }}></i><p style={{ fontWeight: '600' }}>Fully Paid</p></div>}
                                </div>
                            ) : null}
                        </div>
                    </div>
                </div>
            );
        }

        /* ── Printing Logic ── */
        function ThermalSlip({ data, slipRef }) {
            const d = data || {};
            return (
                <div ref={slipRef} className="thermal-slip">
                    <div className="ts-header"><div className="ts-biz">{BN()}</div><div className="ts-subtitle">SALES RECEIPT</div></div>
                    <div className="ts-div"></div>
                    <div className="ts-info">
                        <div><strong>{d.invoice_no || ''}</strong></div>
                        <div>{d.date ? fmtDate(d.date) : ''}</div>
                        <div>Customer: <strong>{d.customer || 'Walk-in'}</strong></div>
                    </div>
                    <div className="ts-div"></div>
                    <div className="ts-items">
                        {(d.items || []).map((item, i) => (
                            <div key={i} className="ts-item">
                                <div className="ts-item-head"><span>{i + 1}. {item.item_name || item.item_code}{(item.qty || 1) > 1 ? ' ×' + (item.qty || 1) : ''}</span><span>{CS()}{(item.line_total || item.total || 0).toLocaleString()}</span></div>
                                <div className="ts-item-sub">@{CS()}{(item.rate || 0).toLocaleString()}</div>
                            </div>
                        ))}
                    </div>
                    <div className="ts-div"></div>
                    <div className="ts-row"><span>Subtotal</span><span>{CS()}{Math.round(d.subtotal || 0).toLocaleString()}</span></div>
                    {(d.discount || 0) > 0 && <div className="ts-row" style={{ color: '#c62828' }}><span>Discount</span><span>-{CS()}{(d.discount || 0).toLocaleString()}</span></div>}
                    <div className="ts-row grand"><span>TOTAL</span><span>{CS()}{(d.grandTotal || 0).toLocaleString()}</span></div>
                    <div className="ts-row paid-row"><span>Paid</span><span>{CS()}{(d.paid || 0).toLocaleString()}</span></div>

        /* ── Customers View ── */
        function CustomersView({ user, openLedger }) {
            const _c = swrGet('customers');
            const [loading, setLoading] = useState(!_c);
            const [customers, setCustomers] = useState(_c || []);
            const [showModal, setShowModal] = useState(false);
            const [editingCust, setEditingCust] = useState(null);
            const [load, setLoad] = useState('');
            const tableRef = useRef(null);

            const canWrite = user.role === 'admin' || user.role === 'manager' || user.role === 'cashier';
            const canDelete = user.role === 'admin';

            useEffect(() => {
                if (_c) setTimeout(() => initTable(_c), 150);
                loadCustomers();
                return () => { if (tableRef.current) tableRef.current.destroy(); };
            }, []);

            const loadCustomers = async () => {
                if (!_c) setLoading(true);
                try {
                    const r = await serverCall('getCustomers', user.id, user.role);
                    setLoading(false);
                    if (r.success) {
                        swrSet('customers', r.data);
                        setCustomers(r.data);
                        initTable(r.data);
                    }
                } catch (e) { setLoading(false); }
            };

            const initTable = (data) => {
                if (tableRef.current) { try { tableRef.current.destroy(); $('#custTable').empty(); } catch (e) { } }
                setTimeout(() => {
                    const t = $('#custTable').DataTable({
                        data, destroy: true,
                        columns: [
                            { data: 'name', title: 'Customer Name', render: (d) => '<strong>' + d + '</strong>' },
                            { data: 'phone', title: 'Phone', render: (d) => d || '—' },
                            { data: 'total_purchase', title: 'Total Buy', render: (d) => CS() + (d || 0).toLocaleString() },
                            { data: 'total_paid', title: 'Total Paid', render: (d) => '<span class="paid-amount">' + CS() + (d || 0).toLocaleString() + '</span>' },
                            { data: 'total_due', title: 'Balance Due', render: (d) => d > 0 ? '<span class="due-amount">' + CS() + d.toLocaleString() + '</span>' : '0' },
                            { data: 'is_active', title: 'Status', render: (d) => `<span class="status-dot ${d == 1 ? 'active' : 'inactive'}"></span> ${d == 1 ? 'Active' : 'Inactive'}` },
                            {
                                data: null, title: 'Actions', orderable: false, render: () => `
                            <button class="action-icon ledger-icon" data-action="ledger" title="Ledger"><i class="fas fa-file-invoice"></i></button>
                            ${canWrite ? `<button class="action-icon edit-icon" data-action="edit" title="Edit"><i class="fas fa-edit"></i></button>` : ''}
                            ${canDelete ? `<button class="action-icon delete-icon" data-action="delete" title="Delete"><i class="fas fa-trash"></i></button>` : ''}
                        `
                            }
                        ],
                        responsive: true, dom: 'Blfrtip'
                    });

                    $('#custTable').off('click', '.action-icon');
                    $('#custTable').on('click', '.action-icon', function () {
                        const action = $(this).data('action');
                        const row = t.row($(this).parents('tr')).data();
                        if (action === 'ledger') openLedger(row.id);
                        else if (action === 'edit') { setEditingCust(row); setShowModal(true); }
                        else if (action === 'delete') handleDelete(row);
                    });
                    tableRef.current = t;
                }, 150);
            };

            const handleDelete = (cust) => {
                Swal.fire({
                    title: 'Are you sure?',
                    text: `Delete ${cust.name}? This will remove all their history!`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ea4335',
                    confirmButtonText: 'Yes, Delete'
                }).then(async (res) => {
                    if (res.isConfirmed) {
                        setLoad('Deleting...');
                        const r = await serverCall('deleteCustomer', cust.id, user.id, user.role);
                        setLoad('');
                        if (r.success) {
                            Swal.fire({ icon: 'success', text: 'Deleted', timer: 1500, showConfirmButton: false });
                            loadCustomers();
                        } else Swal.fire({ icon: 'error', text: r.message });
                    }
                });
            };

            const handleSave = async (formData) => {
                setLoad('Saving...');
                let r;
                if (editingCust) r = await serverCall('updateCustomer', { ...formData, id: editingCust.id }, user.id, user.role);
                else r = await serverCall('addCustomer', formData, user.id, user.role);
                setLoad('');
                if (r.success) {
                    Swal.fire({ icon: 'success', text: 'Success', timer: 1500, showConfirmButton: false });
                    setShowModal(false); setEditingCust(null); loadCustomers();
                } else Swal.fire({ icon: 'error', text: r.message });
            };

            return (
                <div className="data-section">
                    <div className="section-header">
                        <h2><i className="fas fa-user-friends"></i> Customers</h2>
                        {canWrite && <button className="btn btn-success" onClick={() => { setEditingCust(null); setShowModal(true); }}><i className="fas fa-plus"></i> Add Customer</button>}
                    </div>
                    {loading ? <TableSkeleton rows={5} columns={7} /> : <table id="custTable" className="display" style={{ width: '100%' }}></table>}
                    {showModal && <CustomerModal editCust={editingCust} onClose={() => setShowModal(false)} onSave={handleSave} />}
                    {load && <div className="loading-ov"><div className="loading-popup">Please wait...</div></div>}
                </div>
            );
        }

        /* ── Customer Modal ── */
        function CustomerModal({ editCust, onClose, onSave }) {
            const [form, setForm] = useState({
                name: editCust?.name || '',
                phone: editCust?.phone || '',
                address: editCust?.address || '',
                is_active: editCust ? (editCust.is_active == 1) : true
            });

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" style={{ maxWidth: '450px' }} onClick={e => e.stopPropagation()}>
                        <div className="modal-header">
                            <h3><i className="fas fa-user-plus"></i> {editCust ? 'Edit Customer' : 'Add New Customer'}</h3>
                            <button className="close-btn" onClick={onClose}>&times;</button>
                        </div>
                        <div className="modal-body">
                            <form onSubmit={(e) => { e.preventDefault(); onSave(form); }}>
                                <div className="form-group"><label>Full Name *</label><input type="text" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} required /></div>
                                <div className="form-group"><label>Phone Number</label><input type="tel" value={form.phone} onChange={e => setForm({ ...form, phone: e.target.value })} /></div>
                                <div className="form-group"><label>Address</label><textarea rows="2" value={form.address} onChange={e => setForm({ ...form, address: e.target.value })}></textarea></div>
                                <ToggleSwitch label="Status" checked={form.is_active} onChange={v => setForm({ ...form, is_active: v })} />
                                <div className="form-actions">
                                    <button type="submit" className="btn btn-primary">{editCust ? 'Update' : 'Save'} Customer</button>
                                    <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        /* ── Payments Page View ── */
        function PaymentsPageView({ user }) {
            const _c = swrGet('payments');
            const [loading, setLoading] = useState(!_c);
            const [payments, setPayments] = useState(_c || []);
            const [activeTab, setActiveTab] = useState('customer_payment');

            const suppTableRef = useRef(null);

            useEffect(() => {
                if (_c) setTimeout(() => {
                    initTab('customer_payment', _c.filter(p => p.payment_type === 'customer_payment'), custTableRef, 'custPaymentsTable');
                    initTab('supplier_payment', _c.filter(p => p.payment_type === 'supplier_payment'), suppTableRef, 'suppPaymentsTable');
                }, 200);
                loadPayments();
                return () => { dtCleanup();[custTableRef, suppTableRef].forEach(r => { if (r.current) { try { r.current.destroy(); r.current = null; } catch (e) { } } }); };
            }, []);

            const loadPayments = async () => {
                if (!_c) setLoading(true);
                try {
                    const r = await serverCall('getPayments', user.id, user.role);
                    setLoading(false);
                    if (r.success) {
                        swrSet('payments', r.data); setPayments(r.data);
                        setTimeout(() => {
                            initTab('customer_payment', r.data.filter(p => p.payment_type === 'customer_payment'), custTableRef, 'custPaymentsTable');

                    try {
                        tableRefObj.current = $('#' + tableId).DataTable({

                                { data: 'date', title: 'Date', render: (d) => fmtDateShort(d) },

                                { data: 'party_name', title: type === 'customer_payment' ? 'Customer' : 'Supplier' },
                                { data: 'amount', title: 'Amount', render: (d) => '<strong class="paid-amount">' + CS() + (d || 0).toLocaleString() + '</strong>' },
                                { data: 'method', title: 'Method', render: (d) => '<span class="pay-method active" style="font-size:11px;padding:3px 8px;cursor:default">' + (d || '-') + '</span>' },

                            order: [[0, 'desc']]
                        });

            const suppPayments = payments.filter(p => p.payment_type === 'supplier_payment');

                        <button className={`ledger-tab ${activeTab === 'supplier_payment' ? 'active' : ''}`} onClick={() => setActiveTab('supplier_payment')}><i className="fas fa-handshake"></i> Supplier Payments ({suppPayments.length})</button>

                        {custPayments.length > 0 ? <table id="custPaymentsTable" className="display" style={{ width: '100%' }}></table> : (!loading && <div className="empty-state"><i className="fas fa-inbox"></i><p>No customer payments</p></div>)}

                    </div>
                </div>
